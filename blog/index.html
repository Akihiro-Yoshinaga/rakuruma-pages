<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブログ｜出張整備・洗車の現場レポート【ラクルマ】</title>
    <meta name="description" content="ラクルマのスタッフが現場から発信。車種別の作業事例・お客様の悩みと解決策をリアルにお届けします。世田谷・目黒・渋谷エリアの出張整備・洗車サービス。">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;900&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --navy: #003B8B;
            --navy-dark: #002A66;
            --yellow: #F4C430;
            --yellow-dark: #D4A800;
            --green: #06C755;
            --green-dark: #05A847;
            --bg-light: #F5F7FA;
            --text: #1A1A1A;
            --text-muted: #666;
            --border: #E0E8F4;
            --white: #fff;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            color: var(--text);
            line-height: 1.7;
            font-size: 16px;
            background: var(--bg-light);
        }

        img { max-width: 100%; display: block; }
        a { color: inherit; text-decoration: none; }

        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ========== HEADER ========== */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--white);
            border-bottom: 2px solid var(--navy);
            padding: 0 24px;
        }
        .site-header-inner {
            max-width: 960px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
        }
        .site-header-logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: var(--navy);
            letter-spacing: 0.05em;
        }
        .site-header-logo span { color: var(--yellow); }
        .site-header-cta {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--green);
            color: var(--white);
            font-size: 14px;
            font-weight: 700;
            padding: 10px 22px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .site-header-cta:hover { background: var(--green-dark); }
        @media (max-width: 768px) { .site-header-cta { display: none; } }

        /* ========== FIXED CTA (mobile) ========== */
        .fixed-cta {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 999;
            background: var(--white);
            padding: 12px 16px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
        }
        .fixed-cta-inner { display: flex; gap: 10px; }
        .fixed-cta-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 14px 8px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 700;
            min-height: 50px;
        }
        .fixed-cta-btn-line { background: var(--green); color: var(--white); }
        .fixed-cta-btn-reserve { background: var(--navy); color: var(--white); }
        @media (max-width: 768px) {
            .fixed-cta { display: block; }
            body { padding-bottom: 80px; }
        }

        /* ========== PAGE HERO ========== */
        .page-hero {
            background: var(--navy-dark);
            color: var(--white);
            padding: 48px 24px 40px;
            text-align: center;
        }
        .page-hero-label {
            display: inline-block;
            background: var(--yellow);
            color: var(--navy-dark);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            padding: 4px 14px;
            border-radius: 2px;
            margin-bottom: 16px;
        }
        .page-hero h1 {
            font-size: clamp(22px, 4vw, 32px);
            font-weight: 900;
            line-height: 1.4;
            margin-bottom: 12px;
        }
        .page-hero p {
            font-size: 14px;
            color: rgba(255,255,255,0.75);
        }

        /* ========== BLOG LIST ========== */
        .blog-section {
            padding: 48px 0 64px;
        }
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }
        @media (max-width: 600px) {
            .blog-grid { grid-template-columns: 1fr; gap: 16px; }
        }

        .blog-card {
            background: var(--white);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .blog-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        }
        .blog-card-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: #e8eef7;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        .blog-card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .blog-card-body {
            padding: 16px;
        }
        .blog-card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .blog-card-date {
            font-size: 12px;
            color: var(--text-muted);
        }
        .blog-card-tag {
            font-size: 11px;
            font-weight: 700;
            background: #e8eef7;
            color: var(--navy);
            padding: 2px 10px;
            border-radius: 99px;
        }
        .blog-card-title {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.5;
            color: var(--text);
        }

        /* ========== 記事詳細モーダル ========== */
        .article-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0,0,0,0.6);
            overflow-y: auto;
            padding: 20px 16px 40px;
        }
        .article-overlay.open { display: block; }
        .article-modal {
            background: var(--white);
            border-radius: 12px;
            max-width: 720px;
            margin: 0 auto;
            overflow: hidden;
        }
        .article-modal-header {
            background: var(--navy-dark);
            color: var(--white);
            padding: 20px 24px 16px;
            position: relative;
        }
        .article-modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255,255,255,0.15);
            border: none;
            color: var(--white);
            font-size: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .article-modal-close:hover { background: rgba(255,255,255,0.25); }
        .article-modal-date {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 8px;
        }
        .article-modal-title {
            font-size: clamp(18px, 3vw, 24px);
            font-weight: 900;
            line-height: 1.4;
            padding-right: 40px;
        }
        .article-modal-body {
            padding: 28px 24px 32px;
        }
        .article-content {
            font-size: 15px;
            line-height: 1.9;
            color: var(--text);
        }
        .article-content p {
            margin-bottom: 1.2em;
        }
        .article-content img {
            width: 100%;
            border-radius: 8px;
            margin: 16px 0;
        }
        .article-cta {
            margin-top: 32px;
            padding: 24px;
            background: #f0f5ff;
            border-radius: 10px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .article-cta p {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            color: var(--navy);
        }
        .article-cta a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--green);
            color: var(--white);
            font-size: 15px;
            font-weight: 700;
            padding: 14px 32px;
            border-radius: 6px;
        }

        /* ========== ローディング・空状態 ========== */
        .blog-loading {
            text-align: center;
            padding: 60px 0;
            color: var(--text-muted);
            font-size: 15px;
        }
        .blog-empty {
            text-align: center;
            padding: 60px 0;
            color: var(--text-muted);
        }
        .blog-empty p { margin-bottom: 8px; }
    </style>
</head>
<body>

<header class="site-header">
    <div class="site-header-inner">
        <a href="/" class="site-header-logo">ラク<span>ル</span>マ</a>
        <a href="https://lin.ee/r0BAZkR0" class="site-header-cta">
            📱 LINEで無料見積り
        </a>
    </div>
</header>

<div class="fixed-cta">
    <div class="fixed-cta-inner">
        <a href="https://lin.ee/r0BAZkR0" class="fixed-cta-btn fixed-cta-btn-line">📱 LINEで無料見積り</a>
        <a href="https://rakuruma.com/reservation_form/" class="fixed-cta-btn fixed-cta-btn-reserve">📅 Web予約</a>
    </div>
</div>

<div class="page-hero">
    <div class="page-hero-label">BLOG</div>
    <h1>現場レポート</h1>
    <p>スタッフが現場からお届けする、車種別の作業事例と解決策。</p>
</div>

<main>
    <section class="blog-section">
        <div class="container">
            <div id="blogLoading" class="blog-loading">読み込み中...</div>
            <div class="blog-grid" id="blogGrid"></div>
        </div>
    </section>
</main>

<!-- 記事詳細オーバーレイ -->
<div class="article-overlay" id="articleOverlay" onclick="handleOverlayClick(event)">
    <div class="article-modal" id="articleModal">
        <div class="article-modal-header">
            <button class="article-modal-close" onclick="closeArticle()">✕</button>
            <div class="article-modal-date" id="modalDate"></div>
            <div class="article-modal-title" id="modalTitle"></div>
        </div>
        <div class="article-modal-body">
            <div class="article-content" id="modalContent"></div>
            <div class="article-cta">
                <p>同じ車種・似たお悩みの方はお気軽にご相談ください</p>
                <a href="https://lin.ee/r0BAZkR0">📱 LINEで無料相談</a>
            </div>
        </div>
    </div>
</div>

<script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbyAqquwyC0b-2MeriwzDH1b5W4x9ol7CjmDWssq_F1ijo-8HR9C81OSqM_Mtcjsd_Gw/exec';

    function renderCard(post) {
        const thumb = post.photos && post.photos[0]
            ? '<img src="' + post.photos[0] + '" alt="' + (post.title || '') + '" loading="lazy">'
            : '🔧';
        const tag = post.tag ? '<span class="blog-card-tag">' + post.tag + '</span>' : '';
        return '<div class="blog-card" onclick="openArticle(' + post.id + ')">'
            + '<div class="blog-card-thumb">' + thumb + '</div>'
            + '<div class="blog-card-body">'
            + '<div class="blog-card-meta">'
            + '<span class="blog-card-date">' + (post.date || '') + '</span>'
            + tag
            + '</div>'
            + '<div class="blog-card-title">' + (post.title || '') + '</div>'
            + '</div>'
            + '</div>';
    }

    var allPosts = [];

    fetch(GAS_URL + '?action=blogPosts')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            document.getElementById('blogLoading').remove();
            allPosts = data.posts || [];
            if (allPosts.length === 0) {
                document.getElementById('blogGrid').innerHTML =
                    '<div class="blog-empty"><p>記事を準備中です。</p></div>';
                return;
            }
            document.getElementById('blogGrid').innerHTML = allPosts.map(renderCard).join('');

            // ?id=記事ID 付きでアクセスされた場合はその記事を直接開く（整備ページ等からの直リンク用）
            var directId = new URLSearchParams(location.search).get('id');
            if (directId) openArticle(Number(directId));
        })
        .catch(function() {
            document.getElementById('blogLoading').textContent = '記事を読み込めませんでした。';
        });

    function openArticle(id) {
        var post = allPosts.find(function(p) { return p.id === id; });
        if (!post) return;

        document.getElementById('modalDate').textContent = post.date || '';
        document.getElementById('modalTitle').textContent = post.title || '';

        // 本文を段落に分割し、写真を指定位置に挿入
        var blocks = (post.body || '').split('\n').filter(function(l) { return l.trim(); });
        var photos = post.photos || [];
        var photoMap = post.photoPositions || {};  // { "1": 2 } = 写真1を2段落目の後に挿入

        var html = '';
        blocks.forEach(function(block, i) {
            html += '<p>' + block + '</p>';
            // この段落の後に挿入すべき写真を探す
            photos.forEach(function(url, pi) {
                var insertAfter = photoMap[String(pi + 1)];
                if (insertAfter === i + 1) {
                    html += '<img src="' + url + '" alt="作業写真" loading="lazy">';
                }
            });
        });
        // photoMapで指定されていない写真は末尾に追加
        photos.forEach(function(url, pi) {
            var insertAfter = photoMap[String(pi + 1)];
            if (insertAfter === undefined || insertAfter === null || insertAfter === 0) {
                html += '<img src="' + url + '" alt="作業写真" loading="lazy">';
            }
        });

        document.getElementById('modalContent').innerHTML = html;
        document.getElementById('articleOverlay').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeArticle() {
        document.getElementById('articleOverlay').classList.remove('open');
        document.body.style.overflow = '';
    }

    function handleOverlayClick(e) {
        if (e.target === document.getElementById('articleOverlay')) closeArticle();
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeArticle();
    });
</script>

</body>
</html>
