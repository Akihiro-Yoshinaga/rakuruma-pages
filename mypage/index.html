<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ラクルマ｜作業履歴</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Helvetica Neue', sans-serif;
  background: #f0f4f8;
  min-height: 100vh;
  color: #1a202c;
}

/* ヘッダー */
.header {
  background: #003B8B;
  color: #fff;
  padding: 20px 16px 16px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.header-logo { font-size: 20px; font-weight: 800; letter-spacing: 0.05em; }
.header-sub  { font-size: 12px; opacity: 0.75; margin-top: 2px; }

/* 挨拶 */
.greeting {
  background: #fff;
  padding: 18px 16px;
  border-bottom: 1px solid #e2e8f0;
}
.greeting-name { font-size: 16px; font-weight: 700; color: #1a202c; }
.greeting-sub  { font-size: 13px; color: #718096; margin-top: 4px; }

/* 車検満了日 */
.insp {
  background: #fff;
  padding: 14px 16px;
  border-bottom: 1px solid #e2e8f0;
  display: flex;
  align-items: center;
  gap: 10px;
}
.insp-icon { font-size: 22px; }
.insp-label { font-size: 12px; color: #718096; font-weight: 600; }
.insp-date { font-size: 16px; font-weight: 800; color: #003B8B; }

/* 車検ブロック（満了日＋概算見積もり導線） */
.shaken {
  background: #fff;
  padding: 16px;
  border-bottom: 1px solid #e2e8f0;
}
.shaken-head { display: flex; align-items: center; gap: 10px; }
.shaken-icon { font-size: 22px; }
.shaken-label { font-size: 12px; color: #718096; font-weight: 600; }
.shaken-date { font-size: 16px; font-weight: 800; color: #003B8B; }
.shaken-left {
  display: inline-block;
  margin-left: 8px;
  padding: 2px 8px;
  border-radius: 999px;
  background: #EDF2F7;
  color: #4a5568;
  font-size: 12px;
  font-weight: 700;
  vertical-align: middle;
}
.shaken-left.near { background: #FDE8E8; color: #C53030; }
.shaken-btn {
  display: block;
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  background: #003B8B;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}
.shaken-btn:disabled { opacity: 0.55; }
.shaken-btn.line { background: #06C755; }
.shaken-note { font-size: 12px; color: #718096; margin-top: 8px; line-height: 1.6; }
.shaken-status { font-size: 14px; color: #1a202c; margin-top: 12px; line-height: 1.7; }
.shaken-status.err { color: #c53030; }
.shaken-spinner {
  width: 18px; height: 18px;
  border: 2px solid #e2e8f0;
  border-top-color: #003B8B;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  display: inline-block;
  vertical-align: -3px;
  margin-right: 8px;
}
.shaken-cars { margin-top: 12px; }
.shaken-car {
  display: block;
  width: 100%;
  text-align: left;
  padding: 12px 14px;
  margin-bottom: 8px;
  background: #f7fafc;
  border: 1.5px solid #cbd5e0;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  color: #1a202c;
  cursor: pointer;
}
.shaken-car small { display: block; font-weight: 400; font-size: 12px; color: #718096; margin-top: 2px; }

/* 件数 */
.count-bar { padding: 12px 16px; font-size: 13px; color: #4a5568; }
.count-bar span { font-weight: 700; color: #003B8B; }

/* カードリスト */
.list { padding: 0 12px 40px; }
.card {
  background: #fff;
  border-radius: 14px;
  margin-bottom: 12px;
  overflow: hidden;
  box-shadow: 0 1px 6px rgba(0,0,0,.08);
  display: flex;
  text-decoration: none;
  color: inherit;
  transition: transform 0.15s;
  cursor: pointer;
}
.card:active { transform: scale(0.98); }
.card-thumb {
  width: 96px;
  min-height: 96px;
  background: #e2e8f0;
  flex-shrink: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-thumb img { width: 100%; height: 100%; object-fit: cover; }
.card-thumb-placeholder { font-size: 28px; color: #a0aec0; }
.card-body { padding: 14px 14px 12px; flex: 1; min-width: 0; }
.card-date { font-size: 13px; color: #718096; margin-bottom: 4px; }
.card-menu {
  font-size: 15px;
  font-weight: 700;
  color: #1a202c;
  margin-bottom: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-note {
  font-size: 12px;
  color: #4a5568;
  line-height: 1.5;
  margin-bottom: 6px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-staff { font-size: 12px; color: #718096; }
.card-arrow {
  display: flex;
  align-items: center;
  padding-right: 12px;
  color: #cbd5e0;
  font-size: 18px;
}

/* 空状態 */
.empty { text-align: center; padding: 60px 20px; color: #718096; }
.empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-text { font-size: 14px; line-height: 1.7; }

/* フッター */
.footer { text-align: center; padding: 24px 16px; font-size: 11px; color: #a0aec0; }

/* 中央パネル（ローディング・ログイン・電話入力・エラー） */
.center {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
.panel {
  background: #fff;
  border-radius: 16px;
  padding: 36px 24px;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 4px 20px rgba(0,0,0,.1);
  text-align: center;
}
.panel .logo { font-size: 24px; font-weight: 800; color: #003B8B; margin-bottom: 8px; }
.panel p { color: #4a5568; font-size: 14px; line-height: 1.7; margin-bottom: 20px; }
.spinner {
  width: 36px; height: 36px;
  border: 3px solid #e2e8f0;
  border-top-color: #003B8B;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 20px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
.btn-line {
  display: block;
  background: #06C755;
  color: #fff;
  text-decoration: none;
  padding: 14px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
}
.icon-big { font-size: 40px; margin-bottom: 12px; }
.panel input {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border: 1.5px solid #cbd5e0;
  border-radius: 8px;
  margin-bottom: 14px;
}
.panel input:focus { outline: none; border-color: #06C755; }
.panel button {
  width: 100%;
  padding: 13px;
  background: #003B8B;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
.panel button:disabled { opacity: 0.6; }
.err { color: #c53030; font-size: 13px; margin-top: 14px; }

/* ライトボックス（写真拡大） */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.85);
  z-index: 100;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  overflow-y: auto;
  padding: 24px 12px 40px;
}
.lightbox-inner {
  background: #fff;
  border-radius: 14px;
  max-width: 480px;
  width: 100%;
  padding: 16px;
  position: relative;
}
.lightbox-close {
  position: sticky;
  top: 0;
  float: right;
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 50%;
  background: #edf2f7;
  color: #4a5568;
  font-size: 20px;
  line-height: 36px;
  cursor: pointer;
}
.lightbox-date { font-size: 13px; color: #718096; }
.lightbox-menu { font-size: 16px; font-weight: 700; color: #1a202c; margin: 2px 0 4px; }
.lightbox-note { font-size: 13px; color: #4a5568; line-height: 1.6; margin-bottom: 12px; white-space: pre-wrap; }
.lightbox-photos img { width: 100%; border-radius: 8px; margin-bottom: 8px; display: block; }
.lightbox-empty { text-align: center; color: #a0aec0; padding: 24px; font-size: 14px; }

.hidden { display: none; }
</style>
</head>
<body>

<div id="loading" class="center">
  <div class="panel">
    <div class="logo">ラクルマ</div>
    <div class="spinner"></div>
    <div class="msg" id="loadMsg" style="font-size:14px;color:#1a202c;font-weight:700;">読み込み中...</div>
    <div id="loadSub" style="font-size:12px;color:#718096;margin-top:6px;">&nbsp;</div>
  </div>
</div>

<div id="login" class="center hidden">
  <div class="panel">
    <div class="logo">ラクルマ</div>
    <p>過去の作業履歴を確認するには<br>LINEログインが必要です。</p>
    <a class="btn-line" id="loginBtn" href="#">LINEでログイン</a>
  </div>
</div>

<div id="phone" class="center hidden">
  <div class="panel">
    <div class="icon-big">📱</div>
    <p style="font-weight:700;color:#1a202c;font-size:16px;margin-bottom:8px;">初回のみ電話番号を入力してください</p>
    <p>ラクルマにご登録済みの電話番号を入力すると、<br>過去の作業履歴を確認できます。</p>
    <input type="tel" id="phoneInput" placeholder="09012345678" inputmode="numeric">
    <button id="phoneBtn">確認する</button>
    <div class="err hidden" id="phoneErr"></div>
  </div>
</div>

<div id="error" class="center hidden">
  <div class="panel">
    <div class="logo">ラクルマ</div>
    <p id="errorMsg">エラーが発生しました。<br>もう一度お試しください。</p>
    <a class="btn-line" style="background:#003B8B;" href="/mypage/">最初からやり直す</a>
  </div>
</div>

<div id="content" class="hidden"></div>

<div id="footer" class="footer hidden">ラクルマ &copy; 2026</div>

<div id="lightbox" class="lightbox hidden" onclick="closeLightbox(event)">
  <div class="lightbox-inner" onclick="event.stopPropagation()">
    <button class="lightbox-close" onclick="closeLightbox()" aria-label="閉じる">×</button>
    <div class="lightbox-date" id="lbDate"></div>
    <div class="lightbox-menu" id="lbMenu"></div>
    <div class="lightbox-note" id="lbNote"></div>
    <div class="lightbox-photos" id="lbPhotos"></div>
  </div>
</div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbyAqquwyC0b-2MeriwzDH1b5W4x9ol7CjmDWssq_F1ijo-8HR9C81OSqM_Mtcjsd_Gw/exec';
var LIFF_ID = '2004330318-vS44KWOy';
var LIFF_URL = 'https://liff.line.me/' + LIFF_ID;
var LS_KEY = 'rk_hist_token';
var LS_REDIRECT_KEY = 'rk_liff_redirected';
var LS_DATA_KEY = 'rk_hist_data';   // 前回表示した履歴。次回は待たずにこれを先に描く

var params = new URLSearchParams(window.location.search);

// 進行状況の表示（GASは初回2〜20秒かかるため、いま何をしているかを出す）
var loadTimer = null;
function loadStep(msg) {
  var el = document.getElementById('loadMsg');
  if (el) el.textContent = msg;
  if (loadTimer) return;
  var t0 = Date.now();
  loadTimer = setInterval(function() {
    var sec = Math.floor((Date.now() - t0) / 1000);
    var sub = document.getElementById('loadSub');
    if (!sub) return;
    sub.textContent = (sec < 8)
      ? '経過 ' + sec + '秒'
      : '経過 ' + sec + '秒／初回は少し時間がかかります';
  }, 1000);
}
function loadDone() {
  if (loadTimer) { clearInterval(loadTimer); loadTimer = null; }
}

function getToken()   { try { return localStorage.getItem(LS_KEY) || ''; } catch (e) { return ''; } }
function getCachedData() { try { return JSON.parse(localStorage.getItem(LS_DATA_KEY) || 'null'); } catch (e) { return null; } }
function saveCachedData(d) {
  try {
    localStorage.setItem(LS_DATA_KEY, JSON.stringify({
      customerName: d.customerName, inspExpiry: d.inspExpiry, reports: d.reports, cars: d.cars || []
    }));
  } catch (e) {}
}
function saveToken(t) { try { if (t) localStorage.setItem(LS_KEY, t); } catch (e) {} }
function clearToken() { try { localStorage.removeItem(LS_KEY); } catch (e) {} }

function show(id) {
  ['loading', 'login', 'phone', 'error', 'content', 'footer'].forEach(function(x) {
    document.getElementById(x).classList.add('hidden');
  });
  document.getElementById(id).classList.remove('hidden');
  if (id === 'content') document.getElementById('footer').classList.remove('hidden');
}

// 再ログインが必要になったらLIFF認証をやり直す
function goLineLogin() {
  clearToken();
  startLiff();
}

// LIFFへの転送は1回だけ（転送が往復し続けるのを防ぐ。同じタブの間だけ覚える）
function hasRedirected() {
  try { return sessionStorage.getItem(LS_REDIRECT_KEY) === '1'; } catch (e) { return false; }
}
function markRedirected() {
  try { sessionStorage.setItem(LS_REDIRECT_KEY, '1'); } catch (e) {}
}

// LIFFで認証してLINEのIDトークンを取得 → GASへ（LINEアプリ内なら自動ログイン＝パスワード不要）
// ===== リッチメニュー計測（2026-08-19）=====
// リッチメニューから来た場合だけ ?src=rm_xxx が付く。LINEユーザーIDとセットで1件記録する。
// 記録先はGASの「QR計測」シート（パンフQRと同じ仕組みを流用）。失敗しても本体の表示は止めない。
// ⚠️ render() の最後で history.replaceState によりクエリが消える。
//    そのため src は「スクリプト読み込み直後」にここで確保しておくこと。
var RM_SRC = (function () {
  try {
    var qs  = new URLSearchParams(location.search);
    var src = qs.get('src') || '';
    if (!src) {                       // LIFFは ?liff.state=%3Fsrc%3D... で渡してくることがある
      var st = qs.get('liff.state') || '';
      if (st) { try { src = new URLSearchParams(st.charAt(0) === '?' ? st.slice(1) : st).get('src') || ''; } catch (e) {} }
    }
    return /^rm_[a-z]+$/.test(src) ? src : '';
  } catch (e) { return ''; }
})();

function rmSrcQuery() {
  if (!RM_SRC) return '';
  var ua  = navigator.userAgent || '';
  var dev = /iPhone|iPad|iPod/i.test(ua) ? 'ios' : (/Android/i.test(ua) ? 'android' : 'other');
  return '&src=' + encodeURIComponent(RM_SRC) + '&d=' + dev;
}

function startLiff() {
  show('loading');
  loadStep('LINEにログインしています');
  if (typeof liff === 'undefined') {
    showError('LINEの読み込みに失敗しました。<br>通信環境の良い場所で、もう一度お試しください。');
    return;
  }
  liff.init({ liffId: LIFF_ID })
    .then(function() {
      if (!liff.isLoggedIn()) {
        // 普通のブラウザで直接開かれた場合（トークに貼ったURLをタップした等）は、
        // LINEの専用入口へ1回だけ転送する。ウェブ版ログインに回ると
        // 「ログインできませんでした」で止まってしまうため。
        if (!liff.isInClient() && !hasRedirected()) {
          markRedirected();
          location.replace(LIFF_URL);
          return;
        }
        liff.login({ redirectUri: location.href }); // 転送しても未ログインだった場合の最後の手段
        return;
      }
      var idToken = liff.getIDToken();
      if (!idToken) {
        showError('ログイン情報を取得できませんでした。<br>もう一度お試しください。');
        return;
      }
      // リッチメニュー経由なら ?src=rm_mypage が付く。履歴取得の通信に相乗りして
      // サーバー側で記録してもらう（ブラウザからのビーコンはLIFF内で不発になったため）。
      fetchHistory('idToken=' + encodeURIComponent(idToken) + rmSrcQuery());
    })
    .catch(function(e) {
      showError('LINEログインに失敗しました。<br><small style="color:#aaa;">' + (e && e.message ? e.message : '') + '</small>');
    });
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// 履歴カードのタップで、その作業の写真をその場で拡大表示（GASページに飛ばない）
function openLightbox(idx) {
  var r = (window._reports || [])[idx];
  if (!r) return;
  document.getElementById('lbDate').textContent = r.date || '';
  document.getElementById('lbMenu').textContent = r.menu || '出張洗車';
  var noteEl = document.getElementById('lbNote');
  noteEl.textContent = r.workNote || '';
  noteEl.style.display = r.workNote ? 'block' : 'none';
  var photos = r.photoUrls || (r.photoUrl ? [r.photoUrl] : []);
  document.getElementById('lbPhotos').innerHTML = photos.length
    ? photos.map(function(u) { return '<img src="' + escapeHtml(u) + '" alt="作業写真" loading="lazy">'; }).join('')
    : '<div class="lightbox-empty">この作業の写真はありません</div>';
  document.getElementById('lightbox').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(e) {
  document.getElementById('lightbox').classList.add('hidden');
  document.body.style.overflow = '';
}

// 車検満了日までの残り日数バッジ（「2026年11月3日」形式を読む）
function daysLeftBadge(text) {
  var m = String(text || '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if (!m) return '';
  var expiry = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  var today = new Date();
  today.setHours(0, 0, 0, 0);
  var days = Math.round((expiry.getTime() - today.getTime()) / 86400000);
  if (days < 0)  return '<span class="shaken-left near">満了日を過ぎています</span>';
  if (days === 0) return '<span class="shaken-left near">今日が満了日です</span>';
  var label = (days <= 60) ? ('あと' + days + '日') : ('あと約' + Math.round(days / 30) + 'ヶ月');
  return '<span class="shaken-left' + (days <= 60 ? ' near' : '') + '">' + label + '</span>';
}

function shakenStatus(html, isErr) {
  var el = document.getElementById('shakenStatus');
  if (!el) return;
  el.innerHTML = html;
  el.className = 'shaken-status' + (isErr ? ' err' : '');
}

// 概算ボタン：登録車が1台ならそのまま送信、複数台なら選んでもらう
function startShaken() {
  var cars = window._cars || [];
  if (cars.length === 1) { sendShaken(cars[0].row); return; }
  var box = document.getElementById('shakenCars');
  box.innerHTML = '<div class="shaken-note" style="margin-top:0;">どのお車の概算をお送りしますか？</div>'
    + cars.map(function(c) {
        return '<button class="shaken-car" onclick="sendShaken(' + c.row + ')">' + escapeHtml(c.label)
          + (c.plate ? '<small>' + escapeHtml(c.plate) + '</small>' : '') + '</button>';
      }).join('');
  box.classList.remove('hidden');
  document.getElementById('shakenBtn').classList.add('hidden');
}

// LINEのトークへ戻る導線（LINEアプリ内ならマイページを閉じるだけでトークに戻る）
function backToTalkHtml() {
  var inClient = false;
  try { inClient = (typeof liff !== 'undefined') && liff.isInClient(); } catch (e) {}
  return inClient
    ? '<button class="shaken-btn line" onclick="closeMypage()">LINEのトークを開く</button>'
    : '<a class="shaken-btn line" style="text-align:center;text-decoration:none;" href="https://lin.ee/r0BAZkR0">LINEのトークを開く</a>';
}
function closeMypage() {
  try { liff.closeWindow(); } catch (e) {}
}

function sendShaken(row) {
  var box = document.getElementById('shakenCars');
  if (box) { box.classList.add('hidden'); }
  var btn = document.getElementById('shakenBtn');
  if (btn) { btn.disabled = true; btn.classList.add('hidden'); }
  shakenStatus('<span class="shaken-spinner"></span>概算を作成しています。<br>最大1分ほどかかります。この画面を開いたままお待ちください。');

  fetch(GAS_URL + '?action=mypageShaken&token=' + encodeURIComponent(getToken()) + '&row=' + encodeURIComponent(row))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.ok && (d.handled === 'auto_sent' || d.handled === 'quick_sent')) {
        shakenStatus('概算お見積もりをLINEのトークにお送りしました。<br>ご確認ください。' + backToTalkHtml());
      } else if (d.ok && d.handled === 'asked_age') {
        shakenStatus('LINEのトークで、お車の年式をお選びください。<br>選ぶとすぐに概算をお送りします。' + backToTalkHtml());
      } else if (d.ok && d.handled === 'needs_review') {
        shakenStatus('お見積もりを担当が確認しています。<br>まもなくLINEのトークにお送りします。' + backToTalkHtml());
      } else if (d.ok && (d.handled === 'asked_photo' || d.handled === 'no_data')) {
        shakenStatus('ご登録の情報だけでは概算を出せませんでした。<br>LINEのトークに車検証のお写真を1枚お送りください。すぐに概算をお返しします。' + backToTalkHtml());
      } else if (d.expired) {
        clearToken();
        goLineLogin();
      } else {
        shakenStatus('うまく作成できませんでした。お手数ですがLINEのトークからご連絡ください。' + backToTalkHtml(), true);
      }
    })
    .catch(function() {
      shakenStatus('通信エラーが発生しました。電波の良い場所で、もう一度お試しください。' + backToTalkHtml(), true);
    });
}

function render(data) {
  loadDone();
  saveToken(data.token);
  window._data = data;
  if (data.token) saveCachedData(data);

  var html = ''
    + '<div class="header">'
    + '  <div class="header-logo">ラクルマ</div>'
    + '  <div class="header-sub">作業履歴</div>'
    + '</div>'
    + '<div class="greeting">'
    + '  <div class="greeting-name">' + escapeHtml(data.customerName) + ' 様</div>'
    + '  <div class="greeting-sub">いつもご利用いただきありがとうございます。</div>'
    + '</div>';

  window._cars = data.cars || (window._pendingCars || []);
  if (data.inspExpiry || window._cars.length > 0 || !window._carsDone) {
    html += '<div class="shaken">';
    if (data.inspExpiry) {
      html += '<div class="shaken-head">'
        + '<div class="shaken-icon">🔧</div>'
        + '<div><div class="shaken-label">次回車検満了日</div>'
        + '<div class="shaken-date">' + escapeHtml(data.inspExpiry) + daysLeftBadge(data.inspExpiry) + '</div></div>'
        + '</div>';
    }
    if (window._cars.length === 0 && !window._carsDone) {
      // 登録車の取得は重く15〜20秒かかることがある。空白のままだと存在に気づかれないため、
      // 先に無効状態のボタンを出しておく（2026-08-19）
      html += '<button class="shaken-btn" id="shakenBtn" disabled style="opacity:.55;">'
        + '<span class="shaken-spinner"></span>車検の概算見積もりを準備しています…</button>'
        + '<div class="shaken-note">ご登録のお車の情報を読み込んでいます。数十秒かかることがあります。</div>';
    } else if (window._cars.length > 0) {
      html += '<button class="shaken-btn" id="shakenBtn" onclick="startShaken()">車検の概算見積もりを見る（無料）</button>'
        + '<div class="shaken-note">ご登録のお車の情報から概算を計算して、LINEのトークにお送りします。</div>'
        + '<div class="shaken-cars hidden" id="shakenCars"></div>'
        + '<div class="shaken-status hidden" id="shakenStatus"></div>';
    }
    html += '</div>';
  }

  var reports = data.reports || [];
  window._reports = reports;
  if (reports.length > 0) {
    html += '<div class="count-bar">過去の作業：<span>' + reports.length + '件</span></div>';
    html += '<div class="list">';
    reports.forEach(function(r, idx) {
      var thumb = r.photoUrl
        ? '<img src="' + escapeHtml(r.photoUrl) + '" alt="作業写真">'
        : '<div class="card-thumb-placeholder">🚗</div>';
      var note = r.workNote
        ? '<div class="card-note">' + escapeHtml(r.workNote) + '</div>'
        : '';
      html += '<div class="card" onclick="openLightbox(' + idx + ')">'
        + '<div class="card-thumb">' + thumb + '</div>'
        + '<div class="card-body">'
        + '<div class="card-date">' + escapeHtml(r.date) + '</div>'
        + '<div class="card-menu">' + escapeHtml(r.menu || '出張洗車') + '</div>'
        + note
        + '<div class="card-staff">担当：' + escapeHtml(r.staffName || '－') + '</div>'
        + '</div>'
        + '<div class="card-arrow">›</div>'
        + '</div>';
    });
    html += '</div>';
  } else {
    html += '<div class="empty">'
      + '<div class="empty-icon">📋</div>'
      + '<div class="empty-text">まだ作業履歴がありません。<br>初回作業後にこちらに表示されます。</div>'
      + '</div>';
  }

  if (window._refreshing) {
    html = '<div style="background:#EDF2F7;color:#4a5568;font-size:12px;padding:8px 16px;text-align:center;">'
      + '最新の情報を確認しています…</div>' + html;
  }
  document.getElementById('content').innerHTML = html;
  show('content');
  refreshCars();
  // URLからcode/lineIdを消す（リロード時は使用済みcodeではなくキャッシュのlineIdで再取得される）
  if (window.location.search) {
    try { history.replaceState(null, '', '/mypage/'); } catch (e) {}
  }
}

function showError(msg) {
  document.getElementById('errorMsg').innerHTML = msg || 'エラーが発生しました。<br>もう一度お試しください。';
  show('error');
}

// 登録車は履歴より重いので、履歴を描いたあとに取りに行く（初回表示を待たせない）
function refreshCars() {
  if (window._carsLoaded) return;
  window._carsLoaded = true;
  var token = getToken();
  if (!token) return;
  fetch(GAS_URL + '?action=mypageShaken&token=' + encodeURIComponent(token))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      window._carsDone = true;
      if (!d.ok || !Array.isArray(d.cars)) { if (window._data) render(window._data); return; }
      if (!window._data) { window._pendingCars = d.cars; return; }
      var before = JSON.stringify(window._data.cars || []);
      if (before === JSON.stringify(d.cars)) return; // 変化なしなら描き直さない
      window._data.cars = d.cars;
      saveCachedData(window._data);
      render(window._data);
    })
    .catch(function() { window._carsDone = true; if (window._data) render(window._data); });
}

// GASから履歴データを取得（code＝ログイン直後 または token＝発行済み）
// silent=true のときは、すでに表示中のキャッシュを残したまま裏で更新する
function fetchHistory(query, silent) {
  if (!silent) { show('loading'); loadStep('作業履歴を読み込んでいます'); }
  fetch(GAS_URL + '?action=historyData&' + query)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.ok) {
        window._refreshing = false;
        window._carsLoaded = false; // 最新の履歴に合わせて登録車も取り直す
        render(d);
      } else if (silent) {
        window._refreshing = false; // 裏更新の失敗は黙って捨てる（表示中のキャッシュを残す）
      } else if (d.needPhone) {
        saveToken(d.token);   // 紐付け用トークンを保持
        show('phone');
      } else if (d.expired) {
        clearToken();
        goLineLogin();        // 期限切れ・不正 → 再ログイン
      } else {
        clearToken();
        showError('情報を取得できませんでした。<br>もう一度LINEログインからお試しください。');
      }
    })
    .catch(function() {
      if (silent) { window._refreshing = false; return; }
      showError('通信エラーが発生しました。<br>電波の良い場所で再度お試しください。');
    });
}

// 電話番号でLINEを紐付け（トークン経由。生のLINE IDは扱わない）
function submitPhone() {
  var phone = document.getElementById('phoneInput').value.replace(/[-\s]/g, '');
  var errEl = document.getElementById('phoneErr');
  errEl.classList.add('hidden');
  if (!phone) { errEl.textContent = '電話番号を入力してください'; errEl.classList.remove('hidden'); return; }
  var token = getToken();
  if (!token) { goLineLogin(); return; }
  var btn = document.getElementById('phoneBtn');
  btn.disabled = true;
  fetch(GAS_URL + '?action=historyLink&token=' + encodeURIComponent(token) + '&phone=' + encodeURIComponent(phone))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.ok) {
        render(d);
      } else if (d.expired) {
        clearToken();
        goLineLogin();
      } else {
        errEl.textContent = d.error || '電話番号が見つかりませんでした。ラクルマにご登録の番号をお試しください。';
        errEl.classList.remove('hidden');
        btn.disabled = false;
      }
    })
    .catch(function() {
      errEl.textContent = '通信エラーが発生しました。';
      errEl.classList.remove('hidden');
      btn.disabled = false;
    });
}

// 初期化
(function init() {
  document.getElementById('loginBtn').addEventListener('click', function(ev) { ev.preventDefault(); startLiff(); });
  document.getElementById('phoneBtn').addEventListener('click', submitPhone);

  // 有効な署名トークンがキャッシュされていれば、LIFFを通さず即取得（高速・2回目以降）
  // ⚠️ 2回目以降はここで return するため startLiff() を通らない。
  //    リッチメニュー計測(rmSrcQuery)は「必ず通る全経路」に付けること（2026-08-19の不具合）
  var token = getToken();
  if (token) {
    refreshCars();   // 重い登録車の取得は描画を待たず先に走らせる（2026-08-19）
    // 前回の履歴が残っていれば、待たせずにそれを表示してから裏で最新に差し替える
    var cached = getCachedData();
    if (cached && cached.reports) {
      window._refreshing = true;
      render({ customerName: cached.customerName, inspExpiry: cached.inspExpiry,
               reports: cached.reports, cars: cached.cars || [] });
      fetchHistory('token=' + encodeURIComponent(token) + rmSrcQuery(), true);
      return;
    }
    fetchHistory('token=' + encodeURIComponent(token) + rmSrcQuery());
    return;
  }

  // それ以外はLIFFで認証（LINEアプリ内なら自動ログイン）
  startLiff();
})();
</script>
