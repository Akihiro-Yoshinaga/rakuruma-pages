<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ラクルマ公式LINE</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
       background:#fff; margin:0; padding:20px; min-height:100vh; box-sizing:border-box;
       display:flex; align-items:center; justify-content:center; text-align:center; color:#5c6673; line-height:1.9;}
  a{color:#003B8B;}
  .hidden{display:none;}
</style>
</head>
<body>
<div>
  <p id="st-loading">トークを開いています…</p>
  <p id="st-fallback" class="hidden">切り替わらない場合は<a id="lnk-talk" href="https://lin.ee/r0BAZkR0">こちらをタップ</a></p>
</div>
<script>
// ブログ→LINEのLIFF着地ページ（2026-09-08 実験開始）
// 中継ページ /p/line-blog/ がタップを記録して k（タップID）付きでここへ飛ばす。LIFFのログインで取れる
// IDトークンを予約管理GASに渡し、同じ k の行にLINEユーザーIDを書く（lineTapLink）。
// 画面は出さず、記録だけ送ってすぐトークへ移る（9/8 吉永さん：ワンクッションと自動入力の文面は不要）。
// マイページLIFFアプリ（endpoint = /mypage/）のサブパスとして動く。liff.state 経由で /mypage/ から転送される。
var LIFF_ID  = '2004330318-vS44KWOy';
var GAS_URL  = 'https://script.google.com/macros/s/AKfycbyAqquwyC0b-2MeriwzDH1b5W4x9ol7CjmDWssq_F1ijo-8HR9C81OSqM_Mtcjsd_Gw/exec';
var LINE_ADD = 'https://lin.ee/r0BAZkR0';
var TALK_URL = 'https://line.me/R/oaMessage/%40248xbsae/';   // 公式アカウント @248xbsae のトークを直接開く（文面は入れない）
var q = new URLSearchParams(location.search);
var k = q.get('k') || '', src = q.get('src') || 'hp_blog_line', d = q.get('d') || '';

function goTalk() {
  document.getElementById('lnk-talk').href = TALK_URL;
  document.getElementById('st-fallback').classList.remove('hidden');
  location.replace(TALK_URL);
}
function goAdd() {
  document.getElementById('st-fallback').classList.remove('hidden');
  location.replace(LINE_ADD);
}
// 記録は返事を待たない（sendBeacon → だめなら keepalive fetch）。GASはPOSTでも lineTapLink を受ける
function sendLink(idToken) {
  var url = GAS_URL + '?action=lineTapLink&idToken=' + encodeURIComponent(idToken)
          + '&k=' + encodeURIComponent(k) + '&src=' + encodeURIComponent(src) + '&d=' + encodeURIComponent(d);
  var sent = false;
  try { if (navigator.sendBeacon) sent = navigator.sendBeacon(url); } catch (e) {}
  if (!sent) { try { fetch(url, { keepalive: true, mode: 'no-cors' }); } catch (e) {} }
}
function main() {
  if (typeof liff === 'undefined') { goAdd(); return; }
  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) {
      // LINEアプリ内で liff.login() を呼ぶとログインを繰り返す（9/8 実機で発生）。呼ばない。
      // ログイン情報が無い＝正規の入口（liff.line.me）を通っていないので、1回だけ入口に戻す。
      // それでも駄目なら従来の友だち追加リンクへ（追跡は諦めるがお客様は先に進める）
      var retried = false;
      try { retried = sessionStorage.getItem('rk_blog_liff_retry') === '1'; } catch (e) {}
      if (liff.isInClient() && !retried) {
        try { sessionStorage.setItem('rk_blog_liff_retry', '1'); } catch (e) {}
        location.replace('https://liff.line.me/' + LIFF_ID + '/line-blog/' + location.search); return;
      }
      goAdd(); return;
    }
    sendLink(liff.getIDToken() || '');
    setTimeout(goTalk, 150);   // ビーコンを送り出してからトークへ
  }).catch(function () { goAdd(); });
}
main();
</script>
</body>
</html>
