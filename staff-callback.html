<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ラクルマ｜ログイン中...</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Helvetica Neue', sans-serif;
  background: #f0f4f8;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  background: #fff;
  border-radius: 16px;
  padding: 36px 24px;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 4px 20px rgba(0,0,0,.1);
  text-align: center;
}
.logo { font-size: 22px; font-weight: 800; color: #003B8B; margin-bottom: 8px; }
.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid #e2e8f0;
  border-top-color: #003B8B;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 20px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
.msg { font-size: 14px; color: #718096; }
.err { color: #c53030; font-size: 14px; margin-top: 16px; display: none; }
</style>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.png" type="image/png" sizes="256x256">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<div class="card">
  <div class="logo">ラクルマ</div>
  <div class="spinner"></div>
  <div class="msg">ログイン中...</div>
  <div class="err" id="errMsg"></div>
</div>

<script>
// このページは公開されているため、チャンネルシークレットを置いてはいけない。
// 認可コード → LINEユーザーIDの交換はGAS側（staffLineExchange）で行う。
var GAS_URL = 'https://script.google.com/macros/s/AKfycbyAqquwyC0b-2MeriwzDH1b5W4x9ol7CjmDWssq_F1ijo-8HR9C81OSqM_Mtcjsd_Gw/exec';

var params = new URLSearchParams(window.location.search);
var code  = params.get('code');
var state = params.get('state') || 'customers';
var error = params.get('error');

if (error || !code) {
  showError('LINEログインがキャンセルされました。もう一度お試しください。');
} else {
  fetch(GAS_URL + '?action=staffLineExchange&code=' + encodeURIComponent(code))
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (!d || !d.ok || !d.token) {
      showError(((d && d.error) ? d.error : 'ログインに失敗しました。もう一度お試しください。') + (d && d.lineError ? '（' + d.lineError + '）' : ''), true);
      return;
    }
    // 入場券（署名つき・90日）はこの端末の中にだけ保存し、URLには載せない（2026-09-30〜）。
    try { localStorage.setItem('rakuruma_staff_token', d.token); } catch (e) {}
    var parts  = state.split('__');
    var action = parts[0] || 'customers';
    var param  = parts.slice(1).join('__');
    if (action === 'staffHome') { window.location.replace('https://rakuruma.com/staff/'); return; }
    if (action === 'inbox')     { window.location.replace('https://rakuruma.com/staff/inbox/'); return; }
    var q;
    if (action === 'go') q = param;
    else if (action === 'customerDetailByPhone') q = '?action=customerDetailByPhone&phone=' + encodeURIComponent(param);
    else if (action === 'customerJump') q = '?action=customerJump&q=' + encodeURIComponent(param);
    else q = '?action=' + encodeURIComponent(action) + (param ? '&row=' + encodeURIComponent(param) : '');
    // 予約管理GASのページへは中継（5分券）を通す
    window.location.replace('https://rakuruma.com/staff/go/?q=' + encodeURIComponent(q));
  })
  .catch(function(e) { showError('通信エラーが発生しました。再度お試しください。'); });
}

function showError(msg, retry) {
  document.querySelector('.spinner').style.display = 'none';
  document.querySelector('.msg').style.display = 'none';
  var el = document.getElementById('errMsg');
  el.textContent = msg;
  el.style.display = 'block';
  // ログインのコードは1回しか使えないので、この画面の再読み込みでは直らない。最初からやり直す入口を出す
  if (retry) { var a = document.createElement('a'); a.href = 'https://rakuruma.com/staff/'; a.textContent = 'ログインをやり直す'; a.style.cssText = 'display:inline-block;margin-top:18px;background:#06C755;color:#fff;font-weight:700;text-decoration:none;padding:12px 20px;border-radius:12px'; el.parentNode.appendChild(a); }
}
</script>
</body>
</html>
