<div>
  <p>LINEを開いています…</p>
  <p><a href="https://line.me/R/oaMessage/%40248xbsae/?%E6%B1%82%E4%BA%BA%E3%83%9A%E3%83%BC%E3%82%B8%E3%82%92%E8%A6%8B%E3%81%BE%E3%81%97%E3%81%9F%E3%80%82%0A%EF%BC%88%E3%81%9D%E3%81%AE%E3%81%BE%E3%81%BE%E9%80%81%E4%BF%A1%E3%83%9C%E3%82%BF%E3%83%B3%E3%82%92%E6%8A%BC%E3%81%97%E3%81%A6%E3%81%8F%E3%81%A0%E3%81%95%E3%81%84%E3%80%82%E3%81%94%E8%B3%AA%E5%95%8F%E3%81%8C%E3%81%82%E3%82%8C%E3%81%B0%E6%9B%B8%E3%81%8D%E8%B6%B3%E3%81%97%E3%81%A6OK%E3%81%A7%E3%81%99%EF%BC%89">切り替わらない場合はこちらをタップ</a></p>
</div>
<script>
(function () {
  // 採用ページの応募ボタン経由を1件記録してから転送する（recruit_line）
  // 「求人ページを見ました」＋送信案内が入力済みの状態でトークを開く（送信で応募者と確定できる）
  var DEST = "https://line.me/R/oaMessage/%40248xbsae/?%E6%B1%82%E4%BA%BA%E3%83%9A%E3%83%BC%E3%82%B8%E3%82%92%E8%A6%8B%E3%81%BE%E3%81%97%E3%81%9F%E3%80%82%0A%EF%BC%88%E3%81%9D%E3%81%AE%E3%81%BE%E3%81%BE%E9%80%81%E4%BF%A1%E3%83%9C%E3%82%BF%E3%83%B3%E3%82%92%E6%8A%BC%E3%81%97%E3%81%A6%E3%81%8F%E3%81%A0%E3%81%95%E3%81%84%E3%80%82%E3%81%94%E8%B3%AA%E5%95%8F%E3%81%8C%E3%81%82%E3%82%8C%E3%81%B0%E6%9B%B8%E3%81%8D%E8%B6%B3%E3%81%97%E3%81%A6OK%E3%81%A7%E3%81%99%EF%BC%89";
  var ua = navigator.userAgent || '';
  var d = /iPhone|iPad|iPod/i.test(ua) ? 'ios' : (/Android/i.test(ua) ? 'android' : 'other');
  // 本人の端末（/p/owner/ で印を付けたブラウザ）は d=owner で送り、集計側で除外する（2026-09-01）
  try { if (localStorage.getItem('rk_owner') === '1') d = 'owner'; } catch (e) {}
  // 回遊データ（journey.js が localStorage に貯めた初回LP・参照元・経路）を一緒に送る
  var jq = '';
  try {
    var j = JSON.parse(localStorage.getItem('rk_journey') || '{}') || {};
    if (j.ft)  jq += '&ft=' + encodeURIComponent(String(j.ft).slice(0, 80));
    if (j.ref) jq += '&fr=' + encodeURIComponent(String(j.ref).slice(0, 40));
    if (j.n)   jq += '&n='  + (parseInt(j.n, 10) || 0);
    var pp = (j.p || []).slice(-5).map(function (x) { return String(x).slice(0, 60); }).join('>');
    if (pp)    jq += '&pp=' + encodeURIComponent(pp);
  } catch (e) {}
  var ping = "https://script.google.com/macros/s/AKfycbyAqquwyC0b-2MeriwzDH1b5W4x9ol7CjmDWssq_F1ijo-8HR9C81OSqM_Mtcjsd_Gw/exec" + '?track=recruit_line&d=' + d + jq;
  // sendBeaconが使えた場合はimgを撃たない（二重計上の防止）
  var sent = false;
  try { if (navigator.sendBeacon) sent = navigator.sendBeacon(ping); } catch (e) {}
  if (!sent) { try { new Image().src = ping + '&t=' + Date.now(); } catch (e) {} }
  setTimeout(function () { location.replace(DEST); }, 300);
})();
</script>
