<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ラクルマ公式LINEへ移動します</title>
<noscript><meta http-equiv="refresh" content="0; url=https://lin.ee/r0BAZkR0"></noscript>
<style>
  body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
       display:flex; align-items:center; justify-content:center; min-height:90vh;
       margin:0; color:#5c6673; background:#fff; text-align:center; line-height:1.9;}
  a{color:#003B8B;}
</style>
</head>
<body>
<div>
  <p>LINEを開いています…</p>
  <p><a href="https://lin.ee/r0BAZkR0">切り替わらない場合はこちらをタップ</a></p>
</div>
<script>
(function () {
  // ブログ記事のCTA経由を1件記録してから転送する（hp_blog_line）
  var LINE_ADD   = "https://lin.ee/r0BAZkR0";
  // 2026-09-08 実験：スマホはLIFF入口（マイページLIFFアプリのサブパス）へ。ログイン時にLINEユーザーIDが
  // 取れるので「タップ→友だち追加→初回メッセージ」を同じ人として追える。タップの記録は従来どおり先に
  // 送るので hp_blog_line の数え方は変わらない（= タップ数に対するuid取得率がそのままLIFFの離脱率になる）。
  // 悪ければ LIFF_ENTRY への振り分けをやめて LINE_ADD に戻すだけ（記事側は触らない）。
  var LIFF_ENTRY = "https://liff.line.me/2004330318-vS44KWOy/line-blog/";
  // 記事ID（2026-09-09）：どの記事から押したかをLIFF入口に渡し、トークの入力欄に記事URLを自動で入れる。
  // お客様が記事URLを手でコピペして送ってくれた例があり、その手間をなくす（同時にこちらも記事を特定できる）。
  // 記事ページのCTAは同一オリジンのリンクなので document.referrer に記事URLが入る（記事側は触らない）。
  // 将来 ?bid=記事ID を直接付けても動く。数字以外は捨てる
  var bid = '';
  try {
    var qb = new URLSearchParams(location.search).get('bid') || '';
    var rm = (document.referrer || '').match(/^https?:\/\/(?:www\.)?rakuruma\.com\/blog\/(\d{6,20})\/?/);
    bid = /^\d{6,20}$/.test(qb) ? qb : (rm ? rm[1] : '');
  } catch (e) {}
  var ua = navigator.userAgent || '';
  var d = /iPhone|iPad|iPod/i.test(ua) ? 'ios' : (/Android/i.test(ua) ? 'android' : 'other');
  // 本人の端末（/p/owner/ で印を付けたブラウザ）は d=owner で送り、集計側で除外する（2026-09-01）
  try { if (localStorage.getItem('rk_owner') === '1') d = 'owner'; } catch (e) {}
  // タップID：このタップとLIFFで取れるLINEユーザーIDを「同じ1件」として結ぶための乱数
  var k = '';
  try {
    var buf = new Uint8Array(8); crypto.getRandomValues(buf);
    for (var i = 0; i < buf.length; i++) k += ('0' + buf[i].toString(16)).slice(-2);
  } catch (e) { k = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  // 回遊データ（journey.js が localStorage に貯めた初回LP・参照元・経路）を一緒に送る
  var jq = '';
  try {
    var j = JSON.parse(localStorage.getItem('rk_journey') || '{}') || {};
    if (j.ft)  jq += '&ft=' + encodeURIComponent(String(j.ft).slice(0, 80));
    if (j.ref) jq += '&fr=' + encodeURIComponent(String(j.ref).slice(0, 40));
    if (j.n)   jq += '&n='  + (parseInt(j.n, 10) || 0);
    var pp = (j.p || []).slice(-5).map(function (x) { return String(x).slice(0, 60); }).join('>');
    if (pp)    jq += '&pp=' + encodeURIComponent(pp);
  } catch (e) {}
  var ping = "https://script.google.com/macros/s/AKfycbyAqquwyC0b-2MeriwzDH1b5W4x9ol7CjmDWssq_F1ijo-8HR9C81OSqM_Mtcjsd_Gw/exec" + '?track=hp_blog_line&d=' + d + '&k=' + k + jq;
  // sendBeaconが使えた場合はimgを撃たない（二重計上の防止）
  var sent = false;
  try { if (navigator.sendBeacon) sent = navigator.sendBeacon(ping); } catch (e) {}
  if (!sent) { try { new Image().src = ping + '&t=' + Date.now(); } catch (e) {} }
  // スマホ（LINEアプリが開ける）はLIFFへ、PC等は従来の友だち追加リンクへ（QRが出る）
  var DEST = (d === 'ios' || d === 'android' || d === 'owner')
    ? LIFF_ENTRY + '?k=' + k + '&src=hp_blog_line&d=' + d + (bid ? '&bid=' + bid : '')
    : LINE_ADD;
  setTimeout(function () { location.replace(DEST); }, 300);
})();
</script>
</body>
</html>
