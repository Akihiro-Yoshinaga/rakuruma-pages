<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ラクルマ">
<meta name="theme-color" content="#003B8B">
<title>ラクルマ｜スタッフツール</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", -apple-system, Meiryo, sans-serif;
    background: #f5f7fa; color: #1a1a2e; padding: 20px 16px 40px; line-height: 1.6;
  }
  .wrap { max-width: 520px; margin: 0 auto; }

  header { margin-bottom: 20px; }
  .logo { font-size: 24px; font-weight: 800; color: #003B8B; }
  .sub { font-size: 14px; color: #6b7684; margin-top: 2px; }

  .group-title {
    font-size: 12px; font-weight: 800; color: #6b7684; letter-spacing: .06em;
    margin: 22px 0 8px; padding-left: 2px;
  }

  a.tool {
    display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit;
    background: #fff; border-radius: 12px; padding: 16px 16px; margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.07);
  }
  a.tool:active { background: #eef2f8; }
  .icon {
    flex: 0 0 auto; width: 46px; height: 46px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center; font-size: 24px; background: #e8f0fb;
  }
  .icon.green  { background: #e6f4ec; }
  .icon.orange { background: #fff1e6; }
  .txt { flex: 1; min-width: 0; }
  .name { font-size: 17px; font-weight: 700; }
  .desc { font-size: 13px; color: #6b7684; margin-top: 1px; }
  .arrow { flex: 0 0 auto; color: #b7c0cd; font-size: 20px; font-weight: 700; }

  .tip {
    background: #fff; border-left: 4px solid #003B8B; border-radius: 8px;
    padding: 12px 14px; font-size: 13px; color: #44506b; margin-top: 24px;
  }
  .tip strong { color: #003B8B; }
  footer { text-align: center; font-size: 12px; color: #a3adbb; margin-top: 28px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">ラクルマ</div>
    <div class="sub">スタッフツール</div>
  </header>

  <div class="group-title">よく使う</div>

  <a class="tool" href="https://script.google.com/macros/s/AKfycbyAqquwyC0b-2MeriwzDH1b5W4x9ol7CjmDWssq_F1ijo-8HR9C81OSqM_Mtcjsd_Gw/exec?page=links">
    <div class="icon">🔗</div>
    <div class="txt">
      <div class="name">リンク集・定型文</div>
      <div class="desc">決済リンク・お客様への定型文をコピー</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <a class="tool" href="https://script.google.com/macros/s/AKfycbyAqquwyC0b-2MeriwzDH1b5W4x9ol7CjmDWssq_F1ijo-8HR9C81OSqM_Mtcjsd_Gw/exec?action=customers">
    <div class="icon">👥</div>
    <div class="txt">
      <div class="name">顧客管理</div>
      <div class="desc">お客様の履歴・車検・領収書</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <a class="tool" href="https://script.google.com/macros/s/AKfycbwVF0zpW_SQ0wLBySCOBnv1VjMbN-Kjipf6OQXepHHkBa1QLth_A2mK6RvByFbcrgDcIQ/exec">
    <div class="icon green">📊</div>
    <div class="txt">
      <div class="name">経営ダッシュボード</div>
      <div class="desc">売上・利益・KPI</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <div class="group-title">作業・現場</div>

  <a class="tool" href="https://script.google.com/macros/s/AKfycby3tEqjWCmLOXe7nQjRPb69n4wx5NRyyMdctl503KagWu7_GOx6Dc7caVGBP3tfQsREOQ/exec">
    <div class="icon green">🧽</div>
    <div class="txt">
      <div class="name">洗車 作業手順書</div>
      <div class="desc">現場で見る手順・注意点</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <div class="group-title">発信・記事</div>

  <a class="tool" href="https://script.google.com/macros/s/AKfycbyAqquwyC0b-2MeriwzDH1b5W4x9ol7CjmDWssq_F1ijo-8HR9C81OSqM_Mtcjsd_Gw/exec?page=blogTodo">
    <div class="icon orange">📝</div>
    <div class="txt">
      <div class="name">未処理ブログ一覧</div>
      <div class="desc">まだ記事にしていない作業報告</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <a class="tool" href="https://script.google.com/macros/s/AKfycbwANLZLYa-PXyKelTHlNjs2em0_HceyUxrw2LPD6Fh6yVrasnGvN8APdEbU7zAiYrpW/exec">
    <div class="icon orange">✍️</div>
    <div class="txt">
      <div class="name">アフィリ記事生成ツール</div>
      <div class="desc">商品提案・記事づくり・適合調査</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <div class="tip">
    <strong>ホーム画面に置いておくと早いです。</strong><br>
    iPhone：Safariでこのページを開き、下の共有ボタン → 「ホーム画面に追加」。<br>
    次からはアプリのアイコンから1タップで開けます。
  </div>

  <footer>ラクルマスタッフ専用ページ</footer>

</div>
</body>
</html>
