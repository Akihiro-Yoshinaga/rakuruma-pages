<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ラクルマ｜作業手順書（整備）</title>
<style>
  /* GASのウェブアプリをそのまま全画面で埋め込む。
     script.google.com の外枠に付く「Apps Scriptユーザーによって作成された」帯を視界から消すのが目的。
     iframe越しはブラウザのCookie制限でGoogleログイン判定が壊れることがある（特にiPhoneのSafari）ため、
     下に直接開くリンクを常設しておく。 */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { display:flex; flex-direction:column; background:#f5f6f8;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
  iframe { flex:1; border:0; width:100%; }
  .fallback { flex-shrink:0; text-align:center; padding:8px 12px; font-size:12.5px; color:#5c6470;
    background:#fff; border-top:1px solid #e0e4ea; }
  .fallback a { color:#1668d6; font-weight:700; }
</style>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbx9XT-LpLl7wHuWFtPbyEjVeVvIODja20mppovJ5YZ4_3f_UvcpZllOzeAbu1T8IxDH/exec?p=seibi" allow="autoplay; fullscreen" allowfullscreen></iframe>
<div class="fallback">表示されない・ログインを求められて進めない場合は
  <a href="https://script.google.com/macros/s/AKfycbx9XT-LpLl7wHuWFtPbyEjVeVvIODja20mppovJ5YZ4_3f_UvcpZllOzeAbu1T8IxDH/exec?p=seibi">こちらから直接開く</a>
</div>
</body>
</html>
