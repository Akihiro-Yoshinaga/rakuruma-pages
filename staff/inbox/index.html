<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>LINE受信箱 | ラクルマ</title>
<style>
  :root { --navy:#182F66; --gold:#C3A054; --ink:#1A202C; --sub:#4A5568; --mute:#A0AEC0; --line:#E2E8F0; --bg:#F7FAFC; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; color:var(--ink); background:#fff; font-size:15px; }
  .top { background:var(--navy); color:#fff; padding:14px 14px 10px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:5; }
  .top .ttl { font-size:18px; font-weight:800; }
  .top .cnt { font-size:12px; color:#D9BC7A; font-weight:700; }
  .top .back { font-size:22px; font-weight:800; margin-right:2px; cursor:pointer; }
  .lnk, .lnk:link, .lnk:visited, .lnk:hover { margin-left:auto; font-size:13px; font-weight:800; background:#fff; color:var(--navy) !important; border-radius:8px; padding:7px 12px; text-decoration:none !important; white-space:nowrap; display:inline-block; }
  .srch { display:flex; align-items:center; gap:6px; padding:10px 16px; background:#fff; border-bottom:1px solid var(--line); }
  .srch input { flex:1; border:1px solid #D9DDE3; border-radius:6px; padding:11px 12px; font-size:16px; font-family:inherit; background:#fff; }
  .srch input:focus { outline:none; border-color:var(--navy); background:#fff; }
  .srch span { font-size:22px; color:#718096; padding:0 6px; cursor:pointer; }
  .tabs { display:flex; border-bottom:1px solid var(--line); background:#fff; position:sticky; top:52px; z-index:4; }
  .tabs div { flex:1; text-align:center; padding:12px 0; font-size:15px; font-weight:600; color:#8A94A6; cursor:pointer; }
  .tabs .on { color:var(--navy); border-bottom:3px solid var(--navy); }
  .row { display:flex; gap:14px; padding:18px 16px; border-bottom:1px solid #EEF0F3; align-items:center; cursor:pointer; }
  .row.done { opacity:.7; }
  .av { width:48px; height:48px; border-radius:50%; background:#CBD5E0; flex:0 0 48px; display:flex; align-items:center; justify-content:center; font-weight:600; color:#fff; font-size:18px; }
  .row.need .av { background:var(--navy); }
  .b { flex:1; min-width:0; }
  .n { font-size:17px; font-weight:500; display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .n div { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .n span { font-size:13px; color:#9AA1AC; font-weight:400; white-space:nowrap; }
  .m { font-size:14px; color:#8E95A0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:4px; }
  .tag { display:inline-block; font-size:11px; font-weight:600; border-radius:4px; padding:2px 6px; margin-top:7px; margin-right:4px; background:#F1F3F5; color:#5A6472; }
  .t-new { background:#FFF1DB; color:#B06A00; } .t-cust { background:#E6F5EC; color:#1F7A45; } .t-biz { background:#E5EEFA; color:#2B5FA6; } .t-done { background:#F1F3F5; color:#6B7480; } .t-shaken { background:#EFE8FA; color:#6A3FB5; } .t-teiki { background:#E1F3F2; color:#1F6F6A; }
  .badge { background:#E53E3E; color:#fff; font-size:12px; font-weight:700; border-radius:10px; padding:1px 7px; margin-left:6px; vertical-align:1px; }
  .empty { padding:40px 20px; text-align:center; color:var(--mute); font-size:14px; }
  #thread { display:none; }
  .hdrwrap { position:sticky; top:0; z-index:5; }
  .hdr { background:var(--navy); color:#fff; padding:12px 14px; display:flex; align-items:center; gap:10px; }
  .hdr .nm { font-size:17px; font-weight:800; }
  .hdr .sub { font-size:12px; color:#D9BC7A; font-weight:600; }
  .msgs { padding:12px 12px 150px; display:flex; flex-direction:column; gap:10px; background:var(--bg); min-height:60vh; }
  .bub { max-width:84%; padding:10px 14px; border-radius:16px; font-size:16px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .in { background:#fff; border:1px solid var(--line); align-self:flex-start; }
  .out { background:#D6DEEE; color:#1A202C; align-self:flex-end; }
  .meta { font-size:11px; color:var(--mute); margin-top:4px; white-space:normal; }
  .out .meta { color:#4A5A7A; }
  .out.pending { background:#EDF1F8; border:2px dashed #7A8BB0; }
  body.gracing .msgs { padding-bottom:340px; }
  .out.pending .meta { color:#182F66; font-weight:700; }
  .sys { align-self:center; font-size:11px; color:#718096; background:#E2E8F0; padding:3px 10px; border-radius:10px; }
  .compose { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); padding:8px 10px 12px; z-index:6; }
  .msgs { padding-bottom:210px; }
  .tpl { display:flex; gap:6px; overflow-x:auto; margin-bottom:8px; -webkit-overflow-scrolling:touch; }
  .tpl div { font-size:12px; font-weight:700; color:var(--navy); border:1.5px solid var(--navy); border-radius:14px; padding:5px 10px; white-space:nowrap; cursor:pointer; }
  .box { display:flex; gap:8px; align-items:flex-end; }
  textarea { flex:1; border:1.5px solid #CBD5E0; border-radius:14px; padding:10px 12px; font-size:16px; font-family:inherit; resize:none; min-height:44px; max-height:140px; }
  .send { background:var(--navy); color:#fff; font-weight:800; border:0; border-radius:14px; padding:12px 16px; font-size:15px; cursor:pointer; }
  .send:disabled { opacity:.5; }
  .actions { display:flex; gap:8px; padding:8px 12px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .abtn { font-size:12px; font-weight:800; border-radius:8px; padding:6px 10px; background:#fff; border:1.5px solid var(--navy); color:var(--navy); cursor:pointer; text-decoration:none; }
  .abtn.ok { border-color:#38A169; color:#38A169; }
  .note { font-size:12px; color:#C05621; font-weight:700; padding:6px 12px 0; }
  .toast { position:fixed; left:50%; bottom:130px; transform:translateX(-50%); background:#1A202C; color:#fff; font-size:13px; padding:8px 14px; border-radius:10px; display:none; z-index:9; }
  .linkbox { background:#FFF8E7; border:1px solid #E8A33D; margin:8px 12px; border-radius:10px; padding:10px 12px; font-size:13px; }
  .linkbox input { width:100%; font-size:15px; padding:8px; border:1px solid #CBD5E0; border-radius:8px; margin-top:6px; }
  .hit { padding:6px 0; border-bottom:1px solid #F0E6CC; display:flex; justify-content:space-between; align-items:center; gap:8px; }

  /* ---- PC幅：左に一覧・右にスレッド（公式LINEのチャット画面と同じ構成） ---- */
  .emptyPane { display:none; }
  @media (min-width: 900px) {
    html, body { height:100%; overflow:hidden; }
    body { display:flex; }
    #list { display:block !important; flex:0 0 400px; width:400px; height:100vh; overflow-y:auto; border-right:1px solid var(--line); }
    #thread { display:flex !important; flex-direction:column; flex:1; min-width:0; height:100vh; position:relative; }
    body.nocur #thread { display:none !important; }
    body.nocur .emptyPane { display:flex; flex:1; align-items:center; justify-content:center; color:var(--mute); font-size:15px; background:var(--bg); flex-direction:column; gap:6px; }
    .hdr .back { display:none; }
    .msgs { flex:1; overflow-y:auto; padding-bottom:20px; min-height:0; }
    body.gracing .msgs { padding-bottom:120px; }
    .compose { position:static; padding:10px 16px 14px; }
    .bub { max-width:70%; }
    #grace { left:416px !important; right:16px !important; bottom:170px !important; }
    .toast { bottom:190px; }
    .row.sel { background:#EEF2F8; }
    .row:hover { background:#F4F6FA; }
  }
</style>
</head>
<body class="nocur">

<div id="list">
  <div class="top"><a class="back" href="/staff/" style="color:#fff;text-decoration:none">‹</a><div class="ttl">受信箱</div><div class="cnt" id="cnt"></div><a class="lnk" id="reload" href="#">更新</a></div>
  <div class="tabs">
    <div class="on" data-tab="need">未対応</div><div data-tab="all">すべて</div><div data-tab="biz">工場・取引先</div>
  </div>
  <div class="srch"><input id="search" type="search" placeholder="お客様を検索（名前・車種・本文）" autocomplete="off"><span id="searchClear" style="display:none">×</span></div>
  <div id="rows"><div class="empty">読み込み中…</div></div>
</div>

<div id="thread">
  <div class="hdrwrap">
  <div class="hdr"><div class="back" id="back">‹</div><div><div class="nm" id="tName">—</div><div class="sub"><span id="tSub"></span><span id="tRefresh" style="display:none;margin-left:8px;color:#fff;background:rgba(255,255,255,.18);border-radius:8px;padding:1px 7px;font-size:11px">更新中…</span></div></div><a class="lnk" id="tCust" href="#" target="_blank" style="display:none">顧客管理</a></div>
  <div class="actions"><span class="abtn ok" id="btnDone">✓ 対応済みにする</span><span class="abtn" id="btnSched">⏰ 予約送信</span><span class="abtn" id="btnLink" style="display:none">顧客リストに紐付け</span></div>
  </div>
  <div id="schedlist" style="padding:0 12px"></div>
  <div id="schedbox" class="linkbox" style="display:none;background:#EEF4FF;border-color:#2B6CB0">
    <b>予約送信</b>（決めた日時に自動で送ります。前日リマインドなどに）
    <div style="display:flex;gap:8px;margin-top:6px"><input type="date" id="schedDate" style="flex:1"><input type="time" id="schedTime" value="18:00" style="flex:1"></div>
    <textarea id="schedText" rows="3" placeholder="送る本文（下の返信欄に入れた文をそのまま使えます）" style="width:100%;margin-top:6px;font-size:15px;padding:8px;border:1px solid #CBD5E0;border-radius:8px;font-family:inherit"></textarea>
    <div style="margin-top:8px;display:flex;gap:8px"><span class="abtn" id="schedUse">返信欄の文を使う</span><span class="abtn ok" id="schedAdd">この日時で登録</span></div>
  </div>
  <div id="pickbox" class="linkbox" style="display:none">
    <b>このお客様のLINEを選ぶ</b>（LINEの表示名で探します。表示名はカタカナや英語のこともあります）
    <input id="pq" placeholder="LINEの表示名（例：ウケカワ）">
    <div id="phits"></div>
  </div>
  <div id="linkbox" class="linkbox" style="display:none">
    <b>顧客リストと紐付け</b>（名前か電話で検索。無ければ新規登録）
    <input id="q" placeholder="名前 または 電話番号">
    <div id="hits"></div>
    <div style="margin-top:8px"><span class="abtn" id="btnNew">この名前で新規登録</span></div>
  </div>
  <div class="note" id="note"></div>
  <div class="msgs" id="msgs"></div>
  <div class="compose">
    <div class="tpl" id="tpl"></div>
    <div class="box" style="margin-bottom:8px"><input id="intent" placeholder="どう返したい？（例：来週の午前で調整したい・やんわり）" style="flex:1;border:1.5px solid #C3A054;border-radius:14px;padding:9px 12px;font-size:15px;font-family:inherit"><button class="send" id="btnDraft" style="background:#C3A054">AI生成</button></div>
    <div class="box"><label class="send" style="background:#fff;color:var(--navy);border:1.5px solid var(--navy);padding:10px 12px;cursor:pointer">📷<input type="file" id="photo" accept="image/*" style="display:none"></label><textarea id="text" rows="1" placeholder="返信を入力（送信すると記録に残ります）"></textarea><button class="send" id="btnSend">送信</button></div>
  </div>
</div>
<div class="emptyPane" id="emptyPane"><div style="font-size:40px">💬</div><div>左の一覧から選ぶと、ここにやりとりが出ます</div></div>
<div class="toast" id="toast"></div>
<div id="grace" style="display:none;position:fixed;left:12px;right:12px;bottom:150px;background:#1A202C;color:#fff;border-radius:14px;padding:12px 14px;z-index:10;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;align-items:center;gap:10px">
  <div style="flex:1;font-size:14px;font-weight:700"><span id="graceLabel">送信します</span> <span id="graceSec" style="color:#D9BC7A"></span></div>
  <button id="graceCancel" style="background:#E53E3E;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:800">取り消す</button>
</div>

<script>
var TOKEN = '', STAFF = '';
(function() {
  var m = window.location.hash.match(/[#&]t=([^&]+)/) || window.location.search.match(/[?&]token=([^&]+)/);
  if (m) { TOKEN = decodeURIComponent(m[1]); try { localStorage.setItem('rakuruma_staff_token', TOKEN); } catch(e) {} history.replaceState(null, '', window.location.pathname); }
  else { try { TOKEN = localStorage.getItem('rakuruma_staff_token') || ''; } catch(e) {} }
  if (!TOKEN) { window.location.replace('/staff/'); }
})();
var API_URL = 'https://script.google.com/macros/s/AKfycbyAqquwyC0b-2MeriwzDH1b5W4x9ol7CjmDWssq_F1ijo-8HR9C81OSqM_Mtcjsd_Gw/exec';
var ITEMS = [], OTHERS = [], TAB = 'need', CUR = null, TEMPLATES = null;

// 読み取り系は9秒で打ち切って1回だけやり直す（GAS側でたまに30〜40秒止まることがある。送信系はやり直さない）
var API_RETRY_OPS = { list:1, listBiz:1, thread:1, templates:1, scheduleList:1, search:1 };
function api(body) {
  body.action = 'inbox'; body.token = TOKEN;
  var payload = JSON.stringify(body);
  var canRetry = !!API_RETRY_OPS[body.op] && typeof AbortController !== 'undefined';
  function once(timeoutMs) {
    var ctl = timeoutMs ? new AbortController() : null;
    var timer = ctl ? setTimeout(function() { ctl.abort(); }, timeoutMs) : null;
    return fetch(API_URL, { method:'POST', body: payload, signal: ctl ? ctl.signal : undefined }).then(function(r) { if (timer) clearTimeout(timer); return r.json(); }, function(e) { if (timer) clearTimeout(timer); throw e; });
  }
  if (!canRetry) return once(0);
  return once(9000).catch(function() { return once(0); });
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; setTimeout(function(){ t.style.display = 'none'; }, 2200); }
function isDesktop() { return window.matchMedia('(min-width: 900px)').matches; }
function scrollBottom() { var m = document.getElementById('msgs'); if (isDesktop()) m.scrollTop = m.scrollHeight; else window.scrollTo(0, document.body.scrollHeight); }
function shortAt(s) { return String(s || '').replace(/^\d{4}\//, '').replace(/:\d{2}$/, ''); }

var BIZ = null; // 業務連絡は開いたときだけ取りに行く
function loadList() {
  if (!ITEMS.length) {
    try { var c = JSON.parse(localStorage.getItem('rakuruma_inbox_cache') || 'null'); if (c && c.items) { ITEMS = c.items; OTHERS = c.others || []; renderList(); } } catch(e) {}
    if (!ITEMS.length) document.getElementById('rows').innerHTML = '<div class="empty">読み込み中…</div>';
  }
  api({ op:'list' }).then(function(r) {
    if (!r.ok) {
      if (/認証/.test(r.error || '')) { try { localStorage.removeItem('rakuruma_staff_token'); } catch(e) {} window.location.replace('/staff/'); return; }
      document.getElementById('rows').innerHTML = '<div class="empty">' + esc(r.error) + '</div>'; return;
    }
    ITEMS = r.items || []; OTHERS = r.others || []; STAFF = r.staff || STAFF;
    try { localStorage.setItem('rakuruma_inbox_cache', JSON.stringify({ at: Date.now(), items: ITEMS, others: OTHERS })); } catch(e) {}
    renderList();
    if (PENDING_OPEN) { var po = ITEMS.concat(OTHERS).filter(function(x) { return x.uid === PENDING_OPEN; })[0]; PENDING_OPEN = ''; if (po) openThread(po); }
    if (BIZ) loadBiz(true);
  }).catch(function(e) { if (!ITEMS.length) document.getElementById('rows').innerHTML = '<div class="empty">通信エラー: ' + esc(e) + '</div>'; });
}
function loadBiz(silent) {
  if (!silent) document.getElementById('rows').innerHTML = '<div class="empty">読み込み中…</div>';
  api({ op:'listBiz' }).then(function(r) { BIZ = (r.ok && r.items) || []; if (TAB === 'biz') renderList(); });
}

function normQ(t) { return String(t || '').toLowerCase().replace(/[\s\u3000]+/g, '').replace(/[\u30a1-\u30f6]/g, function(c) { return String.fromCharCode(c.charCodeAt(0) - 0x60); }); }
function itemMatches(it, q) {
  var c = it.customer || {};
  return [c.name, c.kana, c.car, c.phone, it.displayName, it.partner, it.lastText].some(function(v) { return normQ(v).indexOf(q) >= 0; });
}
function renderList() {
  var q = normQ(document.getElementById('search').value);
  document.getElementById('searchClear').style.display = q ? 'inline' : 'none';
  var source = q ? ITEMS.concat(BIZ || []).concat(OTHERS) : ((TAB === 'biz') ? (BIZ || []) : ITEMS);
  var items = source.filter(function(it) {
    if (q) return itemMatches(it, q);
    if (TAB === 'need') return it.needsReply;
    return true;
  });
  var need = ITEMS.filter(function(it){ return it.needsReply; }).length + (BIZ || []).filter(function(it){ return it.needsReply; }).length;
  if (!q && TAB === 'biz' && BIZ === null) { document.getElementById('rows').innerHTML = '<div class="empty">読み込み中…</div>'; return; }
  document.getElementById('cnt').textContent = '未対応 ' + need + '件';
  if (!items.length) { document.getElementById('rows').innerHTML = '<div class="empty">' + (q ? '「' + esc(document.getElementById('search').value.trim()) + '」に一致する人はいません' : (TAB === 'need' ? '未対応はありません 🎉' : 'まだ記録がありません')) + '</div>'; return; }
  document.getElementById('rows').innerHTML = items.map(function(it, i) {
    var name = (it.customer && it.customer.name) ? it.customer.name + ' さん' : (it.partner || it.displayName || '（表示名なし）');
    var tags = '';
    if (it.src === 'biz') tags += '<span class="tag t-biz">工場・取引先</span>';
    else if (it.customer) {
      if (it.customer.car) tags += '<span class="tag t-cust">' + esc(it.customer.car) + '</span>';
      if (it.customer.shakenExpiry) tags += '<span class="tag t-shaken">車検 ' + esc(it.customer.shakenExpiry) + '</span>';
      if (it.customer.teiki) tags += '<span class="tag t-teiki">定期プラン</span>';
    } else if (!it.noLog) tags += '<span class="tag t-new">新規・未登録</span>';
    if (it.noLine) tags += '<span class="tag t-new">LINE未連携</span>';
    else if (it.noLog) tags += '<span class="tag t-done">' + (it.customer ? 'やりとりの記録なし' : 'LINE友だち・未登録' + (it.firstSeen ? '（' + esc(it.firstSeen) + '〜）' : '')) + '</span>';
    else if (!it.needsReply) tags += '<span class="tag t-done">対応済み</span>';
    var badge = it.needsReply ? '<span class="badge" title="返信していない受信の件数">' + it.unread + '</span>' : '';
    return '<div class="row ' + (it.needsReply ? 'need' : 'done') + (CUR && CUR.uid === it.uid ? ' sel' : '') + '" data-i="' + source.indexOf(it) + '" data-uid="' + esc(it.uid) + '">'
      + '<div class="av">' + esc(name.charAt(0)) + '</div><div class="b"><div class="n"><div>' + esc(name) + '</div><span>' + esc(shortAt(it.lastAt)) + '</span></div>'
      + '<div class="m">' + (it.noLine ? '顧客リストにLINEが未登録。開いてLINE側の名前を選ぶと送れます' : it.noLog ? (it.customer ? '受信箱に記録がまだありません（開いて送れます）' : '顧客リスト未登録。開いて紐付けてから送れます') : (it.lastDir === '送信' ? '↩ ' : '') + esc(it.lastText)) + '</div>' + tags + badge + '</div></div>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.row'), function(el) { el.onclick = function(){ openThread(source[parseInt(el.getAttribute('data-i'), 10)]); }; });
}

function openThread(it) {
  CUR = it;
  document.body.classList.remove('nocur');
  document.getElementById('list').style.display = 'none';
  document.getElementById('thread').style.display = 'block';
  Array.prototype.forEach.call(document.querySelectorAll('.row'), function(el) { el.classList.toggle('sel', el.getAttribute('data-uid') === it.uid); });
  document.getElementById('linkbox').style.display = 'none';
  document.getElementById('pickbox').style.display = it.noLine ? 'block' : 'none';
  document.querySelector('.compose').style.display = it.noLine ? 'none' : '';
  document.getElementById('btnDone').style.display = it.noLine ? 'none' : '';
  document.getElementById('btnSched').style.display = it.noLine ? 'none' : '';
  document.getElementById('schedbox').style.display = 'none';
  if (it.noLine) {
    var nm0 = (it.customer && it.customer.name) ? it.customer.name + ' さん' : '（名前なし）';
    document.getElementById('tName').textContent = nm0;
    document.getElementById('tSub').textContent = (it.customer && it.customer.car) || '';
    document.getElementById('tRefresh').style.display = 'none';
    var cust0 = document.getElementById('tCust'); cust0.style.display = 'inline-block'; cust0.href = API_URL + '?action=customerDetail&row=' + it.customer.row + '&token=' + encodeURIComponent(TOKEN);
    document.getElementById('btnLink').style.display = 'none';
    document.getElementById('note').textContent = '';
    document.getElementById('schedlist').innerHTML = '';
    document.getElementById('msgs').innerHTML = '<div class="sys">LINEがまだ紐付いていません。上の候補から本人を選ぶと、やりとりと送信ができるようになります</div>';
    document.getElementById('pq').value = ''; renderPick();
    window.scrollTo(0, 0);
    return;
  }
  var cachedT = threadCacheGet(it.uid);
  if (cachedT) renderMsgs(it, cachedT, true); else document.getElementById('msgs').innerHTML = '<div class="sys">読み込み中…</div>';
  var name = (it.customer && it.customer.name) ? it.customer.name + ' さん' : (it.partner || it.displayName || '（表示名なし）');
  document.getElementById('tName').textContent = name;
  document.getElementById('tSub').textContent = it.src === 'biz' ? '工場・取引先（ラクルマ ご依頼・相談）' : (it.customer ? [it.customer.car, it.customer.shakenExpiry ? '車検満了 ' + it.customer.shakenExpiry : '', it.customer.teiki ? '定期プラン' : ''].filter(String).join('・') : 'LINE表示名: ' + (it.displayName || '不明'));
  var cust = document.getElementById('tCust');
  if (it.customer) { cust.style.display = 'inline-block'; cust.href = API_URL + '?action=customerDetail&row=' + it.customer.row + '&token=' + encodeURIComponent(TOKEN); } else cust.style.display = 'none';
  document.getElementById('btnLink').style.display = (it.src === 'cust' && !it.customer) ? 'inline-block' : 'none';
  document.getElementById('note').textContent = it.src === 'biz' ? '' : 'LINEアプリから手で返した分はここに出ません。返信はこの画面から。';
  if (cachedT) scrollBottom(); else window.scrollTo(0, 0);
  loadSched();
  api({ op:'thread', uid: it.uid, src: it.src }).then(function(r) {
    if (CUR !== it) return;
    document.getElementById('tRefresh').style.display = 'none';
    if (!r.ok) { if (!cachedT) document.getElementById('msgs').innerHTML = '<div class="sys">' + esc(r.error) + '</div>'; return; }
    threadCachePut(it.uid, r.messages || []);
    renderMsgs(it, r.messages || [], false);
  }).catch(function() { document.getElementById('tRefresh').style.display = 'none'; if (!cachedT) document.getElementById('msgs').innerHTML = '<div class="sys">通信エラー。右上の更新か、開き直してください</div>'; });
  if (!TEMPLATES) api({ op:'templates' }).then(function(r) { TEMPLATES = (r.ok && r.templates) || []; renderTpl(); }); else renderTpl();
}
// スレッドの直近表示を端末に残し、次に開いたとき一瞬で出す（裏で最新を取り直す）
function threadCacheGet(uid) { try { var c = JSON.parse(localStorage.getItem('rakuruma_inbox_threads') || '{}'); return (c[uid] && c[uid].m) || null; } catch(e) { return null; } }
function threadCachePut(uid, msgs) {
  try {
    var c = JSON.parse(localStorage.getItem('rakuruma_inbox_threads') || '{}');
    c[uid] = { t: Date.now(), m: msgs.slice(-60) };
    var keys = Object.keys(c).sort(function(a, b) { return c[b].t - c[a].t; });
    keys.slice(30).forEach(function(k) { delete c[k]; });
    localStorage.setItem('rakuruma_inbox_threads', JSON.stringify(c));
  } catch(e) {}
}
function renderMsgs(it, msgs, fromCache) {
    var html = '', lastDay = '';
    (msgs || []).forEach(function(m) {
      var day = String(m.at || '').slice(0, 10);
      if (day !== lastDay) { html += '<div class="sys">' + esc(day) + '</div>'; lastDay = day; }
      var isIn = m.dir === '受信';
      var body = m.text || ('（' + m.kind + '）');
      var inner;
      if (m.img) inner = '<a href="' + esc(m.img.view || m.img.full) + '" target="_blank" rel="noopener"><img src="' + esc(m.img.thumb) + '" alt="画像" style="max-width:100%;border-radius:10px;display:block"></a>';
      else if (m.kind === '画像') inner = '（画像：まだ取り込めていません。数分後に更新してください）';
      else inner = esc(body);
      html += '<div class="bub ' + (isIn ? 'in' : 'out') + '">' + inner + '<div class="meta">' + esc(String(m.at || '').slice(11, 16)) + ' ' + esc(isIn ? '受信' : m.kind) + '</div></div>';
    });
    var pend = (CUR === it && graceTimer) ? document.getElementById('pending') : null;
    document.getElementById('tRefresh').style.display = fromCache ? 'inline-block' : 'none';
    document.getElementById('msgs').innerHTML = html || '<div class="sys">記録がありません</div>';
    if (pend) document.getElementById('msgs').appendChild(pend);
    scrollBottom();
}

function renderTpl() {
  document.getElementById('tpl').innerHTML = (TEMPLATES || []).map(function(t, i) { return '<div data-i="' + i + '">' + esc(t.label) + '</div>'; }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#tpl div'), function(el) {
    el.onclick = function() { var ta = document.getElementById('text'); ta.value = (ta.value ? ta.value + '\n' : '') + fill(TEMPLATES[parseInt(el.getAttribute('data-i'), 10)].text); ta.focus(); autosize(); };
  });
}

function autosize() { var ta = document.getElementById('text'); ta.style.height = 'auto'; ta.style.height = Math.min(140, ta.scrollHeight) + 'px'; }
document.getElementById('text').addEventListener('input', autosize);

// ---- 送信までの猶予（15秒。押し間違い・宛先違いをここで止める） ----
var GRACE_SEC = 15, graceTimer = null, graceTick = null;
function withGrace(label, run, onCancel) {
  var box = document.getElementById('grace');
  if (graceTimer) { alert('前の送信の猶予中です。終わってからもう一度お願いします'); return; }
  var left = GRACE_SEC;
  document.getElementById('graceLabel').textContent = label;
  document.getElementById('graceSec').textContent = '（' + left + '秒後に送信）';
  box.style.display = 'flex';
  graceTick = setInterval(function() { left--; document.getElementById('graceSec').textContent = '（' + left + '秒後に送信）'; }, 1000);
  graceTimer = setTimeout(function() { clearGrace(); run(); }, GRACE_SEC * 1000);
  document.getElementById('graceCancel').onclick = function() { clearGrace(); if (onCancel) onCancel(); toast('取り消しました。送信していません'); };
}
function showPending(inner) {
  var box = document.getElementById('msgs');
  var sys = box.querySelector('.sys'); if (sys && box.children.length === 1) box.innerHTML = '';
  var d = document.createElement('div'); d.className = 'bub out pending'; d.id = 'pending';
  d.innerHTML = inner + '<div class="meta">送信待ち（' + GRACE_SEC + '秒以内なら取り消せます）</div>';
  box.appendChild(d); document.body.classList.add('gracing'); scrollBottom();
  return d;
}
function removePending() { var d = document.getElementById('pending'); if (d) d.remove(); document.body.classList.remove('gracing'); }
function clearGrace() { clearTimeout(graceTimer); clearInterval(graceTick); graceTimer = null; graceTick = null; document.getElementById('grace').style.display = 'none'; document.body.classList.remove('gracing'); }
document.getElementById('btnSend').onclick = function() {
  if (!CUR) return;
  var ta = document.getElementById('text'); var text = ta.value.trim();
  if (!text) return;
  if (graceTimer) { alert('前の送信の猶予中です。終わってからもう一度お願いします'); return; }
  var btn = this; var target = CUR; var sentText = text;
  ta.value = ''; autosize();
  showPending(esc(sentText));
  withGrace(((target.customer && target.customer.name) || target.partner || target.displayName || '') + ' へ送信', function() {
  btn.disabled = true;
  api({ op:'send', uid: target.uid, src: target.src, text: sentText }).then(function(r) {
    btn.disabled = false;
    if (r && r.ok === undefined) {
      // GASの応答が別ページに化けることが稀にある。送れているかをスレッドで確かめてから判断する
      return api({ op:'thread', uid: target.uid, src: target.src }).then(function(t) {
        var sent = (t.ok && (t.messages || []).some(function(m) { return m.dir === '送信' && m.text === sentText; }));
        if (sent) { toast('送信しました（記録済み）'); target.needsReply = false; target.unread = 0; if (CUR === target) openThread(CUR); }
        else { removePending(); ta.value = sentText; autosize(); alert('送信を確認できませんでした。スレッドを見て、届いていなければもう一度送ってください'); }
      });
    }
    if (!r.ok) { removePending(); ta.value = sentText; autosize(); alert('送信できませんでした: ' + (r.error || '')); return; }
    toast('送信しました（記録済み）');
    target.needsReply = false; target.unread = 0;
    if (CUR === target) openThread(CUR);
  }).catch(function(e) { btn.disabled = false; removePending(); ta.value = sentText; autosize(); alert('通信エラー: ' + e); });
  }, function() { removePending(); if (CUR === target) { ta.value = sentText; autosize(); ta.focus(); } });
};

document.getElementById('btnDraft').onclick = function() {
  if (!CUR) return;
  var intent = document.getElementById('intent').value.trim();
  var btn = this; btn.disabled = true; btn.textContent = '作成中…';
  api({ op:'draft', uid: CUR.uid, src: CUR.src, intent: intent }).then(function(r) {
    btn.disabled = false; btn.textContent = 'AI生成';
    if (!r.ok) { alert('AI生成できませんでした: ' + (r.error || '')); return; }
    var ta = document.getElementById('text'); ta.value = r.text; autosize(); ta.focus();
    toast('AI生成した文を入れました。直してから送信してください');
  }).catch(function(e) { btn.disabled = false; btn.textContent = 'AI生成'; alert('通信エラー: ' + e); });
};
// ---- 予約送信 ----
function loadSched() {
  var box = document.getElementById('schedlist'); box.innerHTML = '';
  if (!CUR) return;
  api({ op:'scheduleList', uid: CUR.uid }).then(function(r) {
    if (!r.ok || !r.items.length) return;
    box.innerHTML = r.items.map(function(x) {
      return '<div style="background:#EEF4FF;border:1px solid #2B6CB0;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13px"><b>⏰ ' + esc(x.at) + ' に送信予定</b>'
        + '<span class="abtn" data-id="' + esc(x.id) + '" style="float:right;padding:2px 8px;font-size:11px">取消</span><div style="margin-top:4px;white-space:pre-wrap;color:#4A5568">' + esc(x.text) + '</div></div>';
    }).join('');
    Array.prototype.forEach.call(box.querySelectorAll('.abtn'), function(el) {
      el.onclick = function() { if (!confirm('この予約送信を取り消します。よろしいですか？')) return; api({ op:'scheduleCancel', id: el.getAttribute('data-id') }).then(function(r) { if (r.ok) { toast('取り消しました'); loadSched(); } else alert(r.error || '失敗'); }); };
    });
  });
}
document.getElementById('btnSched').onclick = function() {
  var box = document.getElementById('schedbox');
  var open = box.style.display === 'none';
  box.style.display = open ? 'block' : 'none';
  if (open) {
    var d = new Date(Date.now() + 86400000);
    document.getElementById('schedDate').value = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    if (!document.getElementById('schedText').value) document.getElementById('schedText').value = document.getElementById('text').value;
  }
};
document.getElementById('schedUse').onclick = function() { document.getElementById('schedText').value = fill(document.getElementById('text').value); };
document.getElementById('schedAdd').onclick = function() {
  if (!CUR) return;
  var date = document.getElementById('schedDate').value, time = document.getElementById('schedTime').value, text = fill(document.getElementById('schedText').value.trim());
  if (!date || !time) { alert('日付と時刻を選んでください'); return; }
  if (!text) { alert('本文が空です'); return; }
  if (!confirm(date.replace(/-/g, '/') + ' ' + time + ' に次の内容を自動送信します。よろしいですか？\n\n' + text.slice(0, 200))) return;
  api({ op:'scheduleAdd', uid: CUR.uid, src: CUR.src, at: date + ' ' + time, text: text }).then(function(r) {
    if (r && r.ok === undefined) {
      return api({ op:'scheduleList', uid: CUR.uid }).then(function(l) {
        var hit = (l.ok && (l.items || []).some(function(x) { return x.text === text; }));
        if (hit) { toast('予約しました'); document.getElementById('schedbox').style.display = 'none'; document.getElementById('schedText').value = ''; loadSched(); }
        else alert('登録を確認できませんでした。予約一覧を見て、無ければもう一度登録してください');
      });
    }
    if (!r.ok) { alert(r.error || '登録できませんでした'); return; }
    toast('予約しました（' + r.at + '）');
    document.getElementById('schedbox').style.display = 'none'; document.getElementById('schedText').value = '';
    loadSched();
  });
};
// ---- 写真を送る（端末で長辺1600pxに縮小してから送る） ----
document.getElementById('photo').addEventListener('change', function() {
  var f = this.files && this.files[0]; this.value = '';
  if (!f || !CUR) return;
  var img = new Image(); var url = URL.createObjectURL(f);
  img.onload = function() {
    URL.revokeObjectURL(url);
    var max = 1600, w = img.width, h = img.height, s = Math.min(1, max / Math.max(w, h));
    var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    var dataUrl = c.toDataURL('image/jpeg', 0.85);
    if (graceTimer) { alert('前の送信の猶予中です。終わってからもう一度お願いします'); return; }
    var target = CUR;
    showPending('<img src="' + dataUrl + '" alt="送信する写真" style="max-width:100%;border-radius:10px;display:block">');
    withGrace('写真を送信', function() {
    toast('送信中…');
    api({ op:'sendImage', uid: target.uid, src: target.src, dataUrl: dataUrl }).then(function(r) {
      if (r && r.ok === undefined) { toast('送信結果を確認中…'); return openThread(CUR); }
      if (!r.ok) { removePending(); alert('送れませんでした: ' + (r.error || '')); return; }
      toast('写真を送りました（記録済み）'); if (CUR === target) openThread(CUR);
    }).catch(function(e) { removePending(); alert('通信エラー: ' + e); });
    }, function() { removePending(); });
  };
  img.src = url;
});
// ---- 差し込み：{名前}→〇〇さん、{車種}→車名 ----
function fill(text) {
  var nm = (CUR && CUR.customer && CUR.customer.name) ? String(CUR.customer.name).split(/[\s\u3000]+/)[0] + 'さん' : (CUR && (CUR.partner || CUR.displayName)) || 'お客様';
  var car = (CUR && CUR.customer && CUR.customer.car) || 'お車';
  return String(text || '').replace(/\{名前\}/g, nm).replace(/\{車種\}/g, car);
}
document.getElementById('btnDone').onclick = function() {
  if (!CUR) return;
  api({ op:'done', uid: CUR.uid }).then(function(r) { if (r.ok) { toast('対応済みにしました'); CUR.needsReply = false; CUR.unread = 0; } else alert(r.error || '失敗'); });
};

document.getElementById('back').onclick = function() {
  document.getElementById('thread').style.display = 'none';
  document.getElementById('list').style.display = 'block';
  renderList();
};
document.getElementById('reload').onclick = function(e) { e.preventDefault(); loadList(); };
Array.prototype.forEach.call(document.querySelectorAll('.tabs div'), function(el) {
  el.onclick = function() { Array.prototype.forEach.call(document.querySelectorAll('.tabs div'), function(x){ x.classList.remove('on'); }); el.classList.add('on'); TAB = el.getAttribute('data-tab'); renderList(); if (TAB === 'biz' && BIZ === null) loadBiz(false); };
});
document.getElementById('search').addEventListener('input', function() { if (this.value.trim() && BIZ === null) loadBiz(false); renderList(); });
document.getElementById('searchClear').onclick = function() { var i = document.getElementById('search'); i.value = ''; renderList(); i.focus(); };

// ---- 顧客リストとの紐付け ----
// LINE未連携のお客様に、LINE側の候補（受信箱の未登録者・ID自動取得一覧）から本人を選んで紐付ける
var PENDING_OPEN = '';
function pickCandidates() {
  var q = normQ(document.getElementById('pq').value);
  var recent = ITEMS.filter(function(x) { return x.uid && !x.customer; }).map(function(x) { return { uid: x.uid, dn: x.displayName || '（表示名なし）', when: x.lastAt, hint: (x.lastDir === '送信' ? '↩ ' : '') + String(x.lastText || '').slice(0, 40) }; });
  var friends = OTHERS.filter(function(x) { return x.uid && !x.customer; }).map(function(x) { return { uid: x.uid, dn: x.displayName || '（表示名なし）', when: x.firstSeen ? x.firstSeen + '〜' : '', hint: '' }; });
  friends.sort(function(a, b) { return a.when < b.when ? 1 : -1; });
  var all = recent.concat(friends);
  if (q) all = all.filter(function(c) { return normQ(c.dn).indexOf(q) >= 0; });
  return all.slice(0, q ? 30 : 15);
}
function renderPick() {
  var cands = pickCandidates(); var box = document.getElementById('phits');
  box.innerHTML = cands.length ? cands.map(function(c) {
    return '<div class="hit"><div><b>' + esc(c.dn) + '</b><br><span style="color:#718096">' + esc(c.when) + (c.hint ? '　' + esc(c.hint) : '') + '</span></div><span class="abtn ok" data-uid="' + esc(c.uid) + '" data-dn="' + esc(c.dn) + '">この人</span></div>';
  }).join('') : '<div style="color:#718096;padding:6px 0">該当なし（LINE側で1通もやりとりが無い人は出ません）</div>';
  Array.prototype.forEach.call(box.querySelectorAll('.abtn'), function(el) {
    el.onclick = function() {
      if (!CUR || !CUR.noLine) return;
      var cname = CUR.customer.name, row = CUR.customer.row, uid = el.getAttribute('data-uid');
      if (!confirm('LINE「' + el.getAttribute('data-dn') + '」を ' + cname + ' さん（顧客リスト）に紐付けます。同じ電話番号の他の車両の行にも入れます。よろしいですか？')) return;
      api({ op:'link', uid: uid, row: row, expect: cname, samePhone: 1 }).then(function(r) {
        if (!r.ok) { alert(r.error || '失敗'); return; }
        toast('紐付けました（' + ((r.rows || [row]).length) + '行）'); PENDING_OPEN = uid; document.getElementById('search').value = ''; loadList();
      }).catch(function(e) { alert('通信エラー: ' + e); });
    };
  });
}
document.getElementById('pq').addEventListener('input', renderPick);
document.getElementById('btnLink').onclick = function() {
  var box = document.getElementById('linkbox'); box.style.display = box.style.display === 'none' ? 'block' : 'none';
  document.getElementById('q').value = CUR.displayName || ''; searchCust();
};
var searchTimer = null;
document.getElementById('q').addEventListener('input', function() { clearTimeout(searchTimer); searchTimer = setTimeout(searchCust, 400); });
function searchCust() {
  var q = document.getElementById('q').value.trim();
  if (!q) { document.getElementById('hits').innerHTML = ''; return; }
  api({ op:'search', q: q }).then(function(r) {
    var hits = (r.ok && r.hits) || [];
    document.getElementById('hits').innerHTML = hits.length ? hits.map(function(h) {
      return '<div class="hit"><div><b>' + esc(h.name) + '</b> ' + esc(h.car) + '<br><span style="color:#718096">' + esc(h.phone) + (h.uid ? '・LINE紐付け済み' : '') + '</span></div><span class="abtn" data-row="' + h.row + '" data-name="' + esc(h.name) + '">この人</span></div>';
    }).join('') : '<div style="color:#718096;padding:6px 0">該当なし</div>';
    Array.prototype.forEach.call(document.querySelectorAll('#hits .abtn'), function(el) {
      el.onclick = function() {
        if (!confirm(el.getAttribute('data-name') + ' さんの行にこのLINEを紐付けます。よろしいですか？')) return;
        api({ op:'link', uid: CUR.uid, row: el.getAttribute('data-row'), expect: el.getAttribute('data-name'), samePhone: 1 }).then(function(r) {
          if (!r.ok) { alert(r.error || '失敗'); return; }
          toast('紐付けました'); loadList(); document.getElementById('back').onclick();
        });
      };
    });
  });
}
document.getElementById('btnNew').onclick = function() {
  var name = prompt('お客様のお名前（姓 名）', document.getElementById('q').value.trim() || (CUR.displayName || ''));
  if (!name) return;
  var phone = prompt('電話番号（分かれば）', '') || '';
  api({ op:'newCustomer', uid: CUR.uid, name: name, phone: phone }).then(function(r) {
    if (!r.ok) { alert(r.error || '失敗'); return; }
    toast('顧客リストに登録しました（行' + r.row + '）'); loadList(); document.getElementById('back').onclick();
  });
};

loadList();
setInterval(function() { if (isDesktop() || document.getElementById('list').style.display !== 'none') loadList(); }, 90000);
</script>
